<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 22 Quiz - SIMT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal-light: #00b4db;
            --teal-dark: #0083b0;
            --black-main: #0f172a;
            --black-card: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --bg-body: linear-gradient(135deg, #000000 0%, #0f2027 50%, #203a43 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
            background: var(--bg-body);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .layout-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            gap: 30px;
            position: relative;
        }

        /* Sidebar Tracker */
        .sidebar {
            flex: 0 0 320px;
            position: sticky;
            top: 20px;
            height: calc(100vh - 40px);
            background: linear-gradient(160deg, #0a0a0a 0%, #004d40 100%);
            border: 1px solid rgba(0, 180, 219, 0.2);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--teal-light); border-radius: 10px; }

        /* Home Button */
        .home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--teal-light);
            border: 1px solid var(--teal-dark);
            padding: 10px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: var(--teal-light);
            color: var(--black-main);
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.4);
        }

        .home-btn svg {
            width: 18px;
            height: 18px;
        }

        .college-info {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .college-info h1 {
            font-size: 2.2rem;
            background: -webkit-linear-gradient(var(--teal-light), var(--teal-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .instructor-badge {
            display: inline-block;
            background: rgba(0, 180, 219, 0.15);
            border: 1px solid var(--teal-dark);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
            color: var(--teal-light);
        }

        .score-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-title {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 180, 219, 0.5);
        }

        .progress-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: auto;
        }

        .dot {
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .dot.active { border-color: var(--teal-light); color: #fff; box-shadow: 0 0 10px rgba(0,180,219,0.3); }
        .dot.correct { background: var(--success); border-color: var(--success); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .dot.wrong { background: var(--danger); border-color: var(--danger); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        /* Quiz Main Content */
        .main-content {
            flex: 1;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .lecture-header {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--teal-dark);
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .lecture-header h2 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .lecture-header p {
            color: var(--teal-light);
            font-size: 1rem;
        }

        .question-card {
            background: var(--black-card);
            border-radius: 15px;
            padding: 30px;
            border-left: 4px solid var(--teal-dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .bilingual-text {
            margin-bottom: 20px;
        }

        .text-eng {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .text-hin {
            font-size: 1.05rem;
            color: var(--teal-light);
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 180, 219, 0.1);
            border-color: var(--teal-light);
            transform: translateX(5px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn.correct-ans {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            opacity: 1;
        }

        .option-btn.wrong-ans {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            opacity: 1;
        }

        .opt-eng { font-weight: 500; margin-bottom: 4px; }
        .opt-hin { font-size: 0.9rem; color: var(--text-dim); }

        /* Explanations */
        .explanation-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideDown 0.4s ease forwards;
        }

        .explanation-box.correct { background: rgba(16, 185, 129, 0.1); border-left: 3px solid var(--success); }
        .explanation-box.wrong { background: rgba(239, 68, 68, 0.1); border-left: 3px solid var(--danger); }

        .exp-title { font-weight: 600; margin-bottom: 10px; font-size: 1.1rem; }
        .explanation-box.correct .exp-title { color: var(--success); }
        .explanation-box.wrong .exp-title { color: var(--danger); }

        .exp-content-eng { margin-bottom: 8px; font-size: 0.95rem; line-height: 1.5; }
        .exp-content-hin { color: var(--teal-light); font-size: 0.95rem; line-height: 1.5; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .layout-container { flex-direction: column; }
            .sidebar { 
                position: relative; 
                top: 0; 
                height: auto; 
                flex: none; 
                width: 100%; 
                border-radius: 15px;
                padding: 20px;
            }
            .progress-grid { grid-template-columns: repeat(10, 1fr); margin-top: 20px; }
            .score-display { font-size: 2.5rem; }
        }

        @media (max-width: 600px) {
            .progress-grid { grid-template-columns: repeat(5, 1fr); }
            .college-info h1 { font-size: 1.8rem; }
            .text-eng { font-size: 1.05rem; }
            .text-hin { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="layout-container">
    <!-- Tracker Sidebar -->
    <aside class="sidebar">
        <!-- Home Button -->
        <a href="index.html" class="home-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Back to Main Course Page
        </a>

        <div class="college-info">
            <h1>SIMT</h1>
            <div style="font-size: 1.1rem; font-weight: 500; margin-top: 5px;">BBA / BCA 1st Year</div>
            <div style="color: var(--text-dim); font-size: 0.9rem;">Environmental Science</div>
            <div class="instructor-badge">Instructor: HARIS SAIFI</div>
        </div>

        <div class="score-section">
            <div class="score-title">
                स्कोर / Score
            </div>
            <div class="score-display">
                <span id="current-score">0</span><span style="font-size: 1.5rem; color: var(--text-dim);">/20</span>
            </div>
        </div>

        <div class="score-title" style="text-align: center; font-size: 1rem;">
            प्रगति / Progress
        </div>
        <div class="progress-grid" id="progress-grid">
            <!-- JS will generate 20 dots here -->
        </div>
    </aside>

    <!-- Quiz Content -->
    <main class="main-content">
        
        <div class="lecture-header">
            <h2>Lecture 22: Development vs Environment</h2>
            <p>Displacement, Resettlement, and Rehabilitation</p>
        </div>

        <div id="quiz-container" style="display: flex; flex-direction: column; gap: 25px;">
            <!-- JS will generate questions here -->
        </div>
    </main>
</div>

<script>
    const quizData = [
        {
            qE: "What does 'Displacement' mean in the context of development projects?",
            qH: "विकास परियोजनाओं के संदर्भ में 'विस्थापन' (Displacement) का क्या अर्थ है?",
            options: [
                { e: "Moving factory machines to a new place", h: "कारखाने की मशीनों को नई जगह पर ले जाना", correct: false },
                { e: "Forcing local people to leave their homes and ancestral lands due to a project", h: "किसी परियोजना के कारण स्थानीय लोगों को अपने घर और पैतृक भूमि छोड़ने के लिए मजबूर करना", correct: true },
                { e: "Planting trees in a new forest", h: "नए जंगल में पेड़ लगाना", correct: false },
                { e: "Travelling to a new city for a holiday", h: "छुट्टी के लिए नए शहर की यात्रा करना", correct: false }
            ],
            expE: "Displacement occurs when people are uprooted from their natural habitat against their will to make way for dams, mines, or industries.",
            expH: "विस्थापन तब होता है जब लोगों को बांधों, खदानों या उद्योगों के लिए रास्ता बनाने के लिए उनकी इच्छा के विरुद्ध उनके प्राकृतिक आवास से उखाड़ दिया जाता है।"
        },
        {
            qE: "Which type of development project usually displaces the highest number of people globally?",
            qH: "किस प्रकार की विकास परियोजना आमतौर पर विश्व स्तर पर सबसे अधिक लोगों को विस्थापित करती है?",
            options: [
                { e: "Building small schools", h: "छोटे स्कूल बनाना", correct: false },
                { e: "Large Hydroelectric Dams", h: "बड़े जलविद्युत बांध", correct: true },
                { e: "Solar Power Parks", h: "सौर ऊर्जा पार्क", correct: false },
                { e: "Windmills", h: "पवन चक्कियां", correct: false }
            ],
            expE: "Large dams create massive artificial reservoirs that submerge entire villages and forests, displacing millions of people.",
            expH: "बड़े बांध विशाल कृत्रिम जलाशय बनाते हैं जो पूरे के पूरे गांवों और जंगलों को जलमग्न कर देते हैं, जिससे लाखों लोग विस्थापित हो जाते हैं।"
        },
        {
            qE: "What does the term 'Resettlement' mean?",
            qH: "'पुनर्वास' (Resettlement) शब्द का क्या अर्थ है?",
            options: [
                { e: "Moving displaced people to a new physical location and providing them housing", h: "विस्थापित लोगों को एक नए भौतिक स्थान पर ले जाना और उन्हें आवास प्रदान करना", correct: true },
                { e: "Giving people money to travel", h: "लोगों को यात्रा करने के लिए पैसे देना", correct: false },
                { e: "Destroying old houses", h: "पुराने घरों को नष्ट करना", correct: false },
                { e: "Teaching people new languages", h: "लोगों को नई भाषाएँ सिखाना", correct: false }
            ],
            expE: "Resettlement is the process of physically relocating the affected people to a new settlement or colony.",
            expH: "पुनर्वास (Resettlement) प्रभावित लोगों को एक नई बस्ती या कॉलोनी में भौतिक रूप से स्थानांतरित करने की प्रक्रिया है।"
        },
        {
            qE: "Is providing only a new house (Resettlement) enough to solve the problems of displaced people?",
            qH: "क्या विस्थापित लोगों की समस्याओं को हल करने के लिए केवल एक नया घर (Resettlement) प्रदान करना पर्याप्त है?",
            options: [
                { e: "Yes, a house is all they need", h: "हाँ, उन्हें केवल एक घर की आवश्यकता है", correct: false },
                { e: "No, they also need 'Rehabilitation' (livelihood, social support, and jobs)", h: "नहीं, उन्हें 'पुनर्वास/पुनर्स्थापन' (Rehabilitation - आजीविका, सामाजिक समर्थन और नौकरी) की भी आवश्यकता है", correct: true },
                { e: "Yes, as long as the house is big", h: "हाँ, जब तक घर बड़ा है", correct: false },
                { e: "No, they need a car as well", h: "नहीं, उन्हें एक कार की भी आवश्यकता है", correct: false }
            ],
            expE: "A house alone cannot sustain a family. They need their lost livelihood, social structure, and income restored (Rehabilitation).",
            expH: "अकेला एक घर परिवार का भरण-पोषण नहीं कर सकता। उन्हें अपनी खोई हुई आजीविका, सामाजिक संरचना और आय बहाल करने की आवश्यकता है (Rehabilitation)।"
        },
        {
            qE: "What does 'Rehabilitation' involve?",
            qH: "'पुनर्स्थापन/पुनर्वास' (Rehabilitation) में क्या शामिल है?",
            options: [
                { e: "Restoring the social, economic, and cultural livelihoods of the displaced people", h: "विस्थापित लोगों की सामाजिक, आर्थिक और सांस्कृतिक आजीविका को बहाल करना", correct: true },
                { e: "Only giving a one-time cash check", h: "केवल एक बार नकद चेक देना", correct: false },
                { e: "Sending people back to their submerged villages", h: "लोगों को उनके जलमग्न गांवों में वापस भेजना", correct: false },
                { e: "Forcing them to work in the new factories for free", h: "उन्हें नए कारखानों में मुफ्त में काम करने के लिए मजबूर करना", correct: false }
            ],
            expE: "Rehabilitation is a long-term process aimed at improving or restoring the living standards of the affected communities.",
            expH: "पुनर्वास (Rehabilitation) एक दीर्घकालिक प्रक्रिया है जिसका उद्देश्य प्रभावित समुदायों के जीवन स्तर में सुधार या बहाली करना है।"
        },
        {
            qE: "In India, which group of people is historically the most affected by development-induced displacement?",
            qH: "भारत में, ऐतिहासिक रूप से विकास-प्रेरित विस्थापन से कौन सा समूह सबसे अधिक प्रभावित है?",
            options: [
                { e: "Rich businessmen", h: "अमीर व्यापारी", correct: false },
                { e: "Urban IT professionals", h: "शहरी आईटी (IT) पेशेवर", correct: false },
                { e: "Tribal (Adivasi) and rural communities", h: "आदिवासी और ग्रामीण समुदाय", correct: true },
                { e: "Foreign tourists", h: "विदेशी पर्यटक", correct: false }
            ],
            expE: "Most natural resources (minerals, rivers, forests) are located in tribal areas, making indigenous people the primary victims of displacement.",
            expH: "अधिकांश प्राकृतिक संसाधन (खनिज, नदियाँ, जंगल) आदिवासी क्षेत्रों में स्थित हैं, जिससे स्वदेशी लोग विस्थापन के प्राथमिक शिकार बन जाते हैं।"
        },
        {
            qE: "The 'Development vs. Environment' conflict is best described as:",
            qH: "'विकास बनाम पर्यावरण' संघर्ष को सबसे अच्छे तरीके से कैसे वर्णित किया जा सकता है?",
            options: [
                { e: "A debate on whether computers are better than books", h: "कंप्यूटर किताबों से बेहतर हैं या नहीं, इस पर एक बहस", correct: false },
                { e: "The tension between building infrastructure for economic growth and protecting nature and local communities", h: "आर्थिक विकास के लिए बुनियादी ढांचे के निर्माण और प्रकृति तथा स्थानीय समुदायों की रक्षा के बीच का तनाव", correct: true },
                { e: "A fight between two different political parties", h: "दो अलग-अलग राजनीतिक दलों के बीच लड़ाई", correct: false },
                { e: "The choice between planting trees or flowers", h: "पेड़ या फूल लगाने के बीच का विकल्प", correct: false }
            ],
            expE: "It is the difficult balance between industrial/economic progress and the conservation of ecosystems and human rights.",
            expH: "यह औद्योगिक/आर्थिक प्रगति और पारिस्थितिक तंत्र और मानवाधिकारों के संरक्षण के बीच एक कठिन संतुलन है।"
        },
        {
            qE: "What does 'PAP' stand for in environmental and social policies?",
            qH: "पर्यावरण और सामाजिक नीतियों में 'PAP' का क्या अर्थ है?",
            options: [
                { e: "Primary Action Plan", h: "प्राइमरी एक्शन प्लान", correct: false },
                { e: "Project-Affected People", h: "परियोजना प्रभावित लोग (Project-Affected People)", correct: true },
                { e: "Pollution Assessment Policy", h: "पॉल्यूशन असेसमेंट पॉलिसी", correct: false },
                { e: "Public Awareness Program", h: "पब्लिक अवेयरनेस प्रोग्राम", correct: false }
            ],
            expE: "PAPs are the individuals or communities whose lives, lands, or livelihoods are negatively impacted by a development project.",
            expH: "PAP वे व्यक्ति या समुदाय हैं जिनका जीवन, भूमि, या आजीविका किसी विकास परियोजना से नकारात्मक रूप से प्रभावित होती है।"
        },
        {
            qE: "Which social movement became the symbol of the fight against displacement caused by large dams in India?",
            qH: "भारत में बड़े बांधों के कारण होने वाले विस्थापन के खिलाफ लड़ाई का प्रतीक कौन सा सामाजिक आंदोलन बन गया?",
            options: [
                { e: "Chipko Movement", h: "चिपको आंदोलन", correct: false },
                { e: "Narmada Bachao Andolan", h: "नर्मदा बचाओ आंदोलन", correct: true },

    const quizContainer = document.getElementById('quiz-container');
    const progressGrid = document.getElementById('progress-grid');
    const scoreElement = document.getElementById('current-score');
    let currentScore = 0;

    function initQuiz() {
        quizData.forEach((q, index) => {
            const qNum = index + 1;
            
            // 1. Create Progress Dot
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id = `dot-${qNum}`;
            dot.innerText = qNum;
            progressGrid.appendChild(dot);

            // 2. Create Question Card
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${qNum}`;

            // Header Texts (Eng/Hin)
            const headerHTML = `
                <div class="bilingual-text">
                    <div class="text-eng">${qNum}. ${q.qE}</div>
                    <div class="text-hin">${q.qH}</div>
                </div>
                <div class="options-grid" id="options-${qNum}"></div>
                <div class="explanation-box" id="exp-${qNum}"></div>
            `;
            card.innerHTML = headerHTML;
            quizContainer.appendChild(card);

            // Options logic
            const optionsContainer = document.getElementById(`options-${qNum}`);
            const expBox = document.getElementById(`exp-${qNum}`);

            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <span class="opt-eng">${String.fromCharCode(65 + optIndex)}. ${opt.e}</span>
                    <span class="opt-hin">${opt.h}</span>
                `;
                
                btn.onclick = () => handleAnswer(btn, qNum, opt.correct, q, optionsContainer, expBox);
                optionsContainer.appendChild(btn);
            });
        });
    }

    function handleAnswer(selectedBtn, qNum, isCorrect, qData, optionsContainer, expBox) {
        // Disable all buttons in this question
        const allBtns = optionsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        const dot = document.getElementById(`dot-${qNum}`);

        if (isCorrect) {
            selectedBtn.classList.add('correct-ans');
            expBox.classList.add('correct');
            expBox.innerHTML = `
                <div class="exp-title">✓ Correct! / सही उत्तर!</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('correct');
            currentScore++;
            scoreElement.innerText = currentScore;
        } else {
            selectedBtn.classList.add('wrong-ans');
            expBox.classList.add('wrong');
            
            // Find and highlight correct answer
            allBtns.forEach((btn, idx) => {
                if(qData.options[idx].correct) {
                    btn.classList.add('correct-ans');
                }
            });

            expBox.innerHTML = `
                <div class="exp-title">✕ Incorrect / गलत उत्तर</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('wrong');
        }

        expBox.style.display = 'block';
    }

    // Render on load
    window.onload = initQuiz;
</script>
