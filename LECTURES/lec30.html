<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 30 Quiz - SIMT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal-light: #00b4db;
            --teal-dark: #0083b0;
            --black-main: #0f172a;
            --black-card: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --bg-body: linear-gradient(135deg, #000000 0%, #0f2027 50%, #203a43 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
            background: var(--bg-body);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .layout-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            gap: 30px;
            position: relative;
        }

        /* Sidebar Tracker */
        .sidebar {
            flex: 0 0 320px;
            position: sticky;
            top: 20px;
            height: calc(100vh - 40px);
            background: linear-gradient(160deg, #0a0a0a 0%, #004d40 100%);
            border: 1px solid rgba(0, 180, 219, 0.2);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--teal-light); border-radius: 10px; }

        /* Home Button */
        .home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--teal-light);
            border: 1px solid var(--teal-dark);
            padding: 10px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: var(--teal-light);
            color: var(--black-main);
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.4);
        }

        .home-btn svg {
            width: 18px;
            height: 18px;
        }

        .college-info {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .college-info h1 {
            font-size: 2.2rem;
            background: -webkit-linear-gradient(var(--teal-light), var(--teal-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .instructor-badge {
            display: inline-block;
            background: rgba(0, 180, 219, 0.15);
            border: 1px solid var(--teal-dark);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
            color: var(--teal-light);
        }

        .score-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-title {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 180, 219, 0.5);
        }

        .progress-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: auto;
        }

        .dot {
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .dot.active { border-color: var(--teal-light); color: #fff; box-shadow: 0 0 10px rgba(0,180,219,0.3); }
        .dot.correct { background: var(--success); border-color: var(--success); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .dot.wrong { background: var(--danger); border-color: var(--danger); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        /* Quiz Main Content */
        .main-content {
            flex: 1;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .lecture-header {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--teal-dark);
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .lecture-header h2 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .lecture-header p {
            color: var(--teal-light);
            font-size: 1rem;
        }

        .question-card {
            background: var(--black-card);
            border-radius: 15px;
            padding: 30px;
            border-left: 4px solid var(--teal-dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .bilingual-text {
            margin-bottom: 20px;
        }

        .text-eng {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .text-hin {
            font-size: 1.05rem;
            color: var(--teal-light);
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 180, 219, 0.1);
            border-color: var(--teal-light);
            transform: translateX(5px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn.correct-ans {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            opacity: 1;
        }

        .option-btn.wrong-ans {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            opacity: 1;
        }

        .opt-eng { font-weight: 500; margin-bottom: 4px; }
        .opt-hin { font-size: 0.9rem; color: var(--text-dim); }

        /* Explanations */
        .explanation-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideDown 0.4s ease forwards;
        }

        .explanation-box.correct { background: rgba(16, 185, 129, 0.1); border-left: 3px solid var(--success); }
        .explanation-box.wrong { background: rgba(239, 68, 68, 0.1); border-left: 3px solid var(--danger); }

        .exp-title { font-weight: 600; margin-bottom: 10px; font-size: 1.1rem; }
        .explanation-box.correct .exp-title { color: var(--success); }
        .explanation-box.wrong .exp-title { color: var(--danger); }

        .exp-content-eng { margin-bottom: 8px; font-size: 0.95rem; line-height: 1.5; }
        .exp-content-hin { color: var(--teal-light); font-size: 0.95rem; line-height: 1.5; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .layout-container { flex-direction: column; }
            .sidebar { 
                position: relative; 
                top: 0; 
                height: auto; 
                flex: none; 
                width: 100%; 
                border-radius: 15px;
                padding: 20px;
            }
            .progress-grid { grid-template-columns: repeat(10, 1fr); margin-top: 20px; }
            .score-display { font-size: 2.5rem; }
        }

        @media (max-width: 600px) {
            .progress-grid { grid-template-columns: repeat(5, 1fr); }
            .college-info h1 { font-size: 1.8rem; }
            .text-eng { font-size: 1.05rem; }
            .text-hin { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="layout-container">
    <!-- Tracker Sidebar -->
    <aside class="sidebar">
        <!-- Home Button -->
        <a href="index.html" class="home-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Back to Main Course Page
        </a>

        <div class="college-info">
            <h1>SIMT</h1>
            <div style="font-size: 1.1rem; font-weight: 500; margin-top: 5px;">BBA / BCA 1st Year</div>
            <div style="color: var(--text-dim); font-size: 0.9rem;">Environmental Science</div>
            <div class="instructor-badge">Instructor: HARIS SAIFI</div>
        </div>

        <div class="score-section">
            <div class="score-title">

            </div>
            <div class="score-display">
                <span id="current-score">0</span><span style="font-size: 1.5rem; color: var(--text-dim);">/20</span>

        </div>

        <div class="score-title" style="text-align: center; font-size: 1rem;">

        </div>
        <div class="progress-grid" id="progress-grid">

    <!-- Quiz Content -->
    <main class="main-content">
        
        <div class="lecture-header">
            <h2>Lecture 29: IT & Environmental Health</h2>
            <p>Role of IT in Environmental Management and Public Health</p>
        </div>

        <div id="quiz-container" style="display: flex; flex-direction: column; gap: 25px;">
            <!-- JS will generate questions here -->
        </div>
    </main>
</div>

<script>
    const quizData = [
        {
            qE: "What does the term 'Green IT' or 'Green Computing' refer to?",
            qH: "'ग्रीन आईटी' (Green IT) या 'ग्रीन कंप्यूटिंग' शब्द का क्या तात्पर्य है?",
            options: [
                { e: "Painting computers green", h: "कंप्यूटरों को हरे रंग में रंगना", correct: false },
                { e: "The environmentally responsible and eco-friendly use of computers and their resources", h: "कंप्यूटर और उनके संसाधनों का पर्यावरण के प्रति जिम्मेदार और पर्यावरण-अनुकूल उपयोग", correct: true },
                { e: "Using plants inside server rooms", h: "सर्वर रूम के अंदर पौधों का उपयोग करना", correct: false },
                { e: "A software program about nature", h: "प्रकृति के बारे में एक सॉफ्टवेयर प्रोग्राम", correct: false }
            ],
            expE: "Green computing involves designing, manufacturing, using, and disposing of computers with minimal impact on the environment.",
            expH: "ग्रीन कंप्यूटिंग में पर्यावरण पर कम से कम प्रभाव के साथ कंप्यूटर को डिजाइन करना, बनाना, उपयोग करना और निपटाना शामिल है।"
        },
        {
            qE: "Which of the following is a primary goal of Green IT?",
            qH: "निम्नलिखित में से कौन सा ग्रीन आईटी (Green IT) का प्राथमिक लक्ष्य है?",
            options: [
                { e: "To increase the energy consumption of data centers", h: "डेटा केंद्रों की ऊर्जा खपत बढ़ाना", correct: false },
                { e: "To print more physical documents", h: "अधिक भौतिक (कागज वाले) दस्तावेज़ प्रिंट करना", correct: false },
                { e: "To reduce the carbon footprint and hazardous e-waste generated by the IT industry", h: "आईटी उद्योग द्वारा उत्पन्न कार्बन पदचिह्न (carbon footprint) और खतरनाक ई-कचरे को कम करना", correct: true },
                { e: "To make computers run slower", h: "कंप्यूटर को धीमा चलाना", correct: false }
            ],
            expE: "Green IT aims for energy efficiency, reduced use of toxic materials (like lead in soldering), and better recycling.",
            expH: "ग्रीन आईटी का लक्ष्य ऊर्जा दक्षता, विषाक्त पदार्थों (जैसे सोल्डरिंग में सीसा) का कम उपयोग और बेहतर रीसाइक्लिंग है।"
        },
        {
            qE: "What does GIS stand for in environmental management?",
            qH: "पर्यावरण प्रबंधन में GIS का पूर्ण रूप क्या है?",
            options: [
                { e: "Global Information System", h: "ग्लोबल इंफॉर्मेशन सिस्टम", correct: false },
                { e: "Geographic Information System", h: "जियोग्राफिक इंफॉर्मेशन सिस्टम (Geographic Information System)", correct: true },
                { e: "Green IT Software", h: "ग्रीन आईटी सॉफ्टवेयर", correct: false },
                { e: "General Investigation Sector", h: "जनरल इन्वेस्टिगेशन सेक्टर", correct: false }
            ],
            expE: "GIS is a computer system for capturing, storing, checking, and displaying data related to positions on Earth's surface.",
            expH: "GIS पृथ्वी की सतह पर स्थितियों से संबंधित डेटा को पकड़ने, संग्रहीत करने, जांचने और प्रदर्शित करने के लिए एक कंप्यूटर प्रणाली है।"
        },
        {
            qE: "How is GIS commonly used in environmental conservation?",
            qH: "पर्यावरण संरक्षण में GIS का आमतौर पर कैसे उपयोग किया जाता है?",
            options: [
                { e: "To design computer games", h: "कंप्यूटर गेम डिजाइन करने के लिए", correct: false },
                { e: "To map forest cover, track wildlife migration, and analyze pollution patterns spatially", h: "वन आवरण को मैप करने, वन्यजीव प्रवासन को ट्रैक करने और प्रदूषण पैटर्न का स्थानिक विश्लेषण करने के लिए", correct: true },
                { e: "To calculate business taxes", h: "व्यापार कर (taxes) की गणना करने के लिए", correct: false },
                { e: "To write accounting software", h: "अकाउंटिंग सॉफ्टवेयर लिखने के लिए", correct: false }
            ],
            expE: "By layering different types of data (maps, temperatures, forest density), GIS helps scientists make informed conservation decisions.",
            expH: "विभिन्न प्रकार के डेटा (मानचित्र, तापमान, वन घनत्व) को एक के ऊपर एक रखकर, GIS वैज्ञानिकों को सूचित संरक्षण निर्णय लेने में मदद करता है।"
        },
        {
            qE: "Which technology uses satellites or aircraft to collect environmental data (like detecting forest fires or ocean temperatures) from a distance?",
            qH: "कौन सी तकनीक दूर से पर्यावरणीय डेटा (जैसे जंगल की आग या समुद्र के तापमान का पता लगाना) एकत्र करने के लिए उपग्रहों या विमानों का उपयोग करती है?",
            options: [
                { e: "Remote Sensing", h: "रिमोट सेंसिंग (Remote Sensing)", correct: true },
                { e: "Virtual Reality (VR)", h: "आभासी वास्तविकता (VR)", correct: false },
                { e: "Blockchain", h: "ब्लॉकचेन", correct: false },
                { e: "Social Media", h: "सोशल मीडिया", correct: false }
            ],
            expE: "Remote sensing allows us to monitor large or dangerous areas of the Earth without physically being there.",
            expH: "रिमोट सेंसिंग हमें भौतिक रूप से वहां गए बिना पृथ्वी के बड़े या खतरनाक क्षेत्रों की निगरानी करने की अनुमति देता है।"
        },
        {
            qE: "How does IT help in Disaster Management (like floods or cyclones)?",
            qH: "आईटी (IT) आपदा प्रबंधन (जैसे बाढ़ या चक्रवात) में कैसे मदद करता है?",
            options: [
                { e: "By stopping the cyclone physically", h: "चक्रवात को भौतिक रूप से रोककर", correct: false },
                { e: "Through Early Warning Systems, weather forecasting models, and rapid communication networks for evacuation", h: "प्रारंभिक चेतावनी प्रणाली, मौसम पूर्वानुमान मॉडल, और निकासी के लिए तीव्र संचार नेटवर्क के माध्यम से", correct: true },
                { e: "By providing umbrellas to everyone", h: "सभी को छाता उपलब्ध कराकर", correct: false },
                { e: "IT cannot help in physical disasters", h: "भौतिक आपदाओं में आईटी (IT) मदद नहीं कर सकता", correct: false }
            ],
            expE: "Technologies like GPS, satellite imaging, and mobile alerts save millions of lives by providing timely warnings.",
            expH: "जीपीएस, सैटेलाइट इमेजिंग और मोबाइल अलर्ट जैसी प्रौद्योगिकियां समय पर चेतावनी देकर लाखों लोगों की जान बचाती हैं।"
        },
        {
            qE: "What is an ENVIS (Environmental Information System) centre in India?",
            qH: "भारत में ENVIS (पर्यावरण सूचना प्रणाली) केंद्र क्या है?",
            options: [
                { e: "A center that builds solar panels", h: "एक केंद्र जो सौर पैनल बनाता है", correct: false },
                { e: "A network established by the government to collect, collate, and disseminate environmental data to researchers and the public", h: "शोधकर्ताओं और जनता को पर्यावरणीय डेटा एकत्र करने, उसका मिलान करने और प्रसार करने के लिए सरकार द्वारा स्थापित एक नेटवर्क", correct: true },
                { e: "A factory that recycles plastic", h: "एक फैक्ट्री जो प्लास्टिक को रिसाइकल करती है", correct: false },
                { e: "A tourist park", h: "एक पर्यटक पार्क", correct: false }
            ],
            expE: "ENVIS is a decentralized system that provides comprehensive environmental information for decision-making.",
            expH: "ENVIS एक विकेन्द्रीकृत प्रणाली है जो निर्णय लेने के लिए व्यापक पर्यावरणीय जानकारी प्रदान करती है।"
        },
        {
            qE: "How can implementing 'Cloud Computing' benefit the environment?",
            qH: "'क्लाउड कंप्यूटिंग' लागू करने से पर्यावरण को कैसे लाभ हो सकता है?",
            options: [
                { e: "It creates physical clouds that bring rain", h: "यह भौतिक बादल बनाता है जो बारिश लाते हैं", correct: false },
                { e: "By reducing the need for individual companies to maintain their own energy-hungry servers, consolidating them into efficient, shared data centers", h: "अलग-अलग कंपनियों द्वारा अपने स्वयं के ऊर्जा-भूखे सर्वर बनाए रखने की आवश्यकता को कम करके, उन्हें कुशल, साझा डेटा केंद्रों में समेकित करके", correct: true },
                { e: "By automatically planting trees", h: "स्वतः पेड़ लगाकर", correct: false },
                { e: "It doesn't benefit the environment at all", h: "इससे पर्यावरण को कोई लाभ नहीं होता", correct: false }
            ],
            expE: "Large cloud providers (like Google or AWS) are much more energy-efficient and often use renewable energy compared to small, private server rooms.",
            expH: "बड़े क्लाउड प्रदाता (जैसे Google या AWS) बहुत अधिक ऊर्जा-कुशल होते हैं और छोटे, निजी सर्वर रूम की तुलना में अक्सर नवीकरणीय ऊर्जा का उपयोग करते हैं।"
        },

    const quizContainer = document.getElementById('quiz-container');
    const progressGrid = document.getElementById('progress-grid');
    const scoreElement = document.getElementById('current-score');
    let currentScore = 0;

    function initQuiz() {
        quizData.forEach((q, index) => {
            const qNum = index + 1;
            
            // 1. Create Progress Dot
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id = `dot-${qNum}`;
            dot.innerText = qNum;
            progressGrid.appendChild(dot);

            // 2. Create Question Card
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${qNum}`;

            // Header Texts (Eng/Hin)
            const headerHTML = `
                <div class="bilingual-text">
                    <div class="text-eng">${qNum}. ${q.qE}</div>
                    <div class="text-hin">${q.qH}</div>
                </div>
                <div class="options-grid" id="options-${qNum}"></div>
                <div class="explanation-box" id="exp-${qNum}"></div>
            `;
            card.innerHTML = headerHTML;
            quizContainer.appendChild(card);

            // Options logic
            const optionsContainer = document.getElementById(`options-${qNum}`);
            const expBox = document.getElementById(`exp-${qNum}`);

            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <span class="opt-eng">${String.fromCharCode(65 + optIndex)}. ${opt.e}</span>
                    <span class="opt-hin">${opt.h}</span>
                `;
                
                btn.onclick = () => handleAnswer(btn, qNum, opt.correct, q, optionsContainer, expBox);
                optionsContainer.appendChild(btn);
            });
        });
    }

    function handleAnswer(selectedBtn, qNum, isCorrect, qData, optionsContainer, expBox) {
        // Disable all buttons in this question
        const allBtns = optionsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        const dot = document.getElementById(`dot-${qNum}`);

        if (isCorrect) {
            selectedBtn.classList.add('correct-ans');
            expBox.classList.add('correct');
            expBox.innerHTML = `
                <div class="exp-title">✓ Correct! / सही उत्तर!</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('correct');
            currentScore++;
            scoreElement.innerText = currentScore;
        } else {
            selectedBtn.classList.add('wrong-ans');
            expBox.classList.add('wrong');
            
            // Find and highlight correct answer
            allBtns.forEach((btn, idx) => {
                if(qData.options[idx].correct) {
                    btn.classList.add('correct-ans');
                }
            });

            expBox.innerHTML = `
                <div class="exp-title">✕ Incorrect / गलत उत्तर</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('wrong');
        }

        expBox.style.display = 'block';
    }

    // Render on load
    window.onload = initQuiz;
</script>

</body>
</html>
