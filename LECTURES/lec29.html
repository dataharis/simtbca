<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 29 Quiz - SIMT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal-light: #00b4db;
            --teal-dark: #0083b0;
            --black-main: #0f172a;
            --black-card: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --bg-body: linear-gradient(135deg, #000000 0%, #0f2027 50%, #203a43 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
            background: var(--bg-body);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .layout-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            gap: 30px;
            position: relative;
        }

        /* Sidebar Tracker */
        .sidebar {
            flex: 0 0 320px;
            position: sticky;
            top: 20px;
            height: calc(100vh - 40px);
            background: linear-gradient(160deg, #0a0a0a 0%, #004d40 100%);
            border: 1px solid rgba(0, 180, 219, 0.2);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--teal-light); border-radius: 10px; }

        /* Home Button */
        .home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--teal-light);
            border: 1px solid var(--teal-dark);
            padding: 10px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: var(--teal-light);
            color: var(--black-main);
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.4);
        }

        .home-btn svg {
            width: 18px;
            height: 18px;
        }

        .college-info {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .college-info h1 {
            font-size: 2.2rem;
            background: -webkit-linear-gradient(var(--teal-light), var(--teal-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .instructor-badge {
            display: inline-block;
            background: rgba(0, 180, 219, 0.15);
            border: 1px solid var(--teal-dark);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
            color: var(--teal-light);
        }

        .score-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-title {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 180, 219, 0.5);
        }

        .progress-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: auto;
        }

        .dot {
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .dot.active { border-color: var(--teal-light); color: #fff; box-shadow: 0 0 10px rgba(0,180,219,0.3); }
        .dot.correct { background: var(--success); border-color: var(--success); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .dot.wrong { background: var(--danger); border-color: var(--danger); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        /* Quiz Main Content */
        .main-content {
            flex: 1;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .lecture-header {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--teal-dark);
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .lecture-header h2 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .lecture-header p {
            color: var(--teal-light);
            font-size: 1rem;
        }

        .question-card {
            background: var(--black-card);
            border-radius: 15px;
            padding: 30px;
            border-left: 4px solid var(--teal-dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .bilingual-text {
            margin-bottom: 20px;
        }

        .text-eng {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .text-hin {
            font-size: 1.05rem;
            color: var(--teal-light);
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 180, 219, 0.1);
            border-color: var(--teal-light);
            transform: translateX(5px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn.correct-ans {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            opacity: 1;
        }

        .option-btn.wrong-ans {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            opacity: 1;
        }

        .opt-eng { font-weight: 500; margin-bottom: 4px; }
        .opt-hin { font-size: 0.9rem; color: var(--text-dim); }

        /* Explanations */
        .explanation-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideDown 0.4s ease forwards;
        }

        .explanation-box.correct { background: rgba(16, 185, 129, 0.1); border-left: 3px solid var(--success); }
        .explanation-box.wrong { background: rgba(239, 68, 68, 0.1); border-left: 3px solid var(--danger); }

        .exp-title { font-weight: 600; margin-bottom: 10px; font-size: 1.1rem; }
        .explanation-box.correct .exp-title { color: var(--success); }
        .explanation-box.wrong .exp-title { color: var(--danger); }

        .exp-content-eng { margin-bottom: 8px; font-size: 0.95rem; line-height: 1.5; }
        .exp-content-hin { color: var(--teal-light); font-size: 0.95rem; line-height: 1.5; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .layout-container { flex-direction: column; }
            .sidebar { 
                position: relative; 
                top: 0; 
                height: auto; 
                flex: none; 
                width: 100%; 
                border-radius: 15px;
                padding: 20px;
            }
            .progress-grid { grid-template-columns: repeat(10, 1fr); margin-top: 20px; }
            .score-display { font-size: 2.5rem; }
        }

        @media (max-width: 600px) {
            .progress-grid { grid-template-columns: repeat(5, 1fr); }
            .college-info h1 { font-size: 1.8rem; }
            .text-eng { font-size: 1.05rem; }
            .text-hin { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="layout-container">
    <!-- Tracker Sidebar -->
    <aside class="sidebar">
        <!-- Home Button -->
        <a href="index.html" class="home-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Back to Main Course Page
        </a>

        <div class="college-info">
            <h1>SIMT</h1>
            <div style="font-size: 1.1rem; font-weight: 500; margin-top: 5px;">BBA / BCA 1st Year</div>
            <div style="color: var(--text-dim); font-size: 0.9rem;">Environmental Science</div>
            <div class="instructor-badge">Instructor: HARIS SAIFI</div>
        </div>

        <div class="score-section">
            <div class="score-title">
                स्कोर / Score
            </div>
            <div class="score-display">
                <span id="current-score">0</span><span style="font-size: 1.5rem; color: var(--text-dim);">/20</span>
            </div>
        </div>

        <div class="score-title" style="text-align: center; font-size: 1rem;">
            प्रगति / Progress
        </div>
        <div class="progress-grid" id="progress-grid">
            <!-- JS will generate 20 dots here -->
        </div>
    </aside>

    <!-- Quiz Content -->
    <main class="main-content">
        
        <div class="lecture-header">
            <h2>Lecture 29: Disaster Management</h2>
            <p>Phases, Causes, and Vulnerability</p>
        </div>

        <div id="quiz-container" style="display: flex; flex-direction: column; gap: 25px;">
            <!-- JS will generate questions here -->
        </div>
    </main>
</div>

<script>
    const quizData = [
        {
            qE: "What is a 'Disaster'?",
            qH: "'आपदा' (Disaster) क्या है?",
            options: [
                { e: "A minor traffic jam", h: "एक मामूली ट्रैफिक जाम", correct: false },
                { e: "A sudden, catastrophic event that causes immense damage, loss of life, and disrupts the normal functioning of a community", h: "एक अचानक, विनाशकारी घटना जो भारी क्षति, जीवन की हानि का कारण बनती है और एक समुदाय के सामान्य कामकाज को बाधित करती है", correct: true },
                { e: "A heavy rainfall on a Sunday", h: "रविवार को भारी बारिश", correct: false },
                { e: "A power cut for 5 minutes", h: "5 मिनट के लिए बिजली कटौती", correct: false }
            ],
            expE: "A disaster is beyond the capacity of the affected community to cope with using its own resources.",
            expH: "एक आपदा प्रभावित समुदाय की अपने संसाधनों का उपयोग करके सामना करने की क्षमता से परे होती है।"
        },
        {
            qE: "Earthquakes, Tsunamis, and Cyclones are examples of:",
            qH: "भूकंप, सुनामी और चक्रवात किसके उदाहरण हैं?",
            options: [
                { e: "Man-made Disasters", h: "मानव निर्मित आपदाएँ", correct: false },
                { e: "Natural Disasters", h: "प्राकृतिक आपदाएँ (Natural Disasters)", correct: true },
                { e: "Biological Disasters", h: "जैविक आपदाएँ", correct: false },
                { e: "Chemical Disasters", h: "रासायनिक आपदाएँ", correct: false }
            ],
            expE: "These are extreme natural events that occur due to the earth's natural processes.",
            expH: "ये अत्यधिक प्राकृतिक घटनाएँ हैं जो पृथ्वी की प्राकृतिक प्रक्रियाओं के कारण होती हैं।"
        },
        {
            qE: "Which of the following is considered a 'Man-made Disaster'?",
            qH: "निम्नलिखित में से किसे 'मानव निर्मित आपदा' (Man-made Disaster) माना जाता है?",
            options: [
                { e: "Volcanic Eruption", h: "ज्वालामुखी विस्फोट", correct: false },
                { e: "Nuclear radiation leak", h: "परमाणु विकिरण रिसाव (Nuclear radiation leak)", correct: true },
                { e: "Tornado", h: "बवंडर", correct: false },
                { e: "Drought", h: "सूखा", correct: false }
            ],
            expE: "Industrial accidents, terrorism, and nuclear leaks are catastrophic events caused by human action or error.",
            expH: "औद्योगिक दुर्घटनाएं, आतंकवाद और परमाणु रिसाव मानवीय कार्रवाई या त्रुटि के कारण होने वाली विनाशकारी घटनाएं हैं।"
        },
        {
            qE: "The continuous cycle of planning, preparing, responding, and recovering from disasters is known as:",
            qH: "आपदाओं की योजना बनाने, तैयारी करने, प्रतिक्रिया देने और उबरने के निरंतर चक्र को किस रूप में जाना जाता है?",
            options: [
                { e: "Disaster Management Cycle", h: "आपदा प्रबंधन चक्र (Disaster Management Cycle)", correct: true },
                { e: "Weather Forecasting", h: "मौसम पूर्वानुमान", correct: false },
                { e: "Environmental Assessment", h: "पर्यावरणीय मूल्यांकन", correct: false },
                { e: "Urban Planning", h: "शहरी नियोजन", correct: false }
            ],
            expE: "It is an ongoing process by which governments and communities plan for and reduce the impact of disasters.",
            expH: "यह एक सतत प्रक्रिया है जिसके द्वारा सरकारें और समुदाय आपदाओं के प्रभाव की योजना बनाते हैं और उन्हें कम करते हैं।"
        },
        {
            qE: "Which phase of Disaster Management involves taking actions BEFORE a disaster strikes to reduce its impact (e.g., building earthquake-resistant houses)?",
            qH: "आपदा प्रबंधन के किस चरण में आपदा के प्रभाव को कम करने के लिए उसके आने से पहले कार्रवाई करना शामिल है (जैसे, भूकंप-रोधी घर बनाना)?",
            options: [
                { e: "Response", h: "प्रतिक्रिया (Response)", correct: false },
                { e: "Recovery", h: "पुनर्प्राप्ति (Recovery)", correct: false },
                { e: "Mitigation", h: "न्यूनीकरण/शमन (Mitigation)", correct: true },
                { e: "Rehabilitation", h: "पुनर्वास", correct: false }
            ],
            expE: "Mitigation focuses on long-term measures to prevent hazards from developing into disasters altogether or to reduce the effects of disasters.",
            expH: "न्यूनीकरण (Mitigation) खतरों को पूरी तरह से आपदाओं में विकसित होने से रोकने या आपदाओं के प्रभावों को कम करने के लिए दीर्घकालिक उपायों पर केंद्रित है।"
        },
        {
            qE: "Conducting mock drills, stocking up emergency food supplies, and having an evacuation plan falls under which phase?",
            qH: "मॉक ड्रिल आयोजित करना, आपातकालीन भोजन की आपूर्ति का भंडारण करना और निकासी (evacuation) योजना बनाना किस चरण के अंतर्गत आता है?",
            options: [
                { e: "Preparedness", h: "तैयारी (Preparedness)", correct: true },
                { e: "Recovery", h: "पुनर्प्राप्ति", correct: false },
                { e: "Reconstruction", h: "पुनर्निर्माण", correct: false },
                { e: "Mitigation", h: "न्यूनीकरण", correct: false }
            ],
            expE: "Preparedness ensures that communities and authorities are ready to act quickly and efficiently when a disaster hits.",
            expH: "तैयारी (Preparedness) यह सुनिश्चित करती है कि समुदाय और अधिकारी आपदा आने पर त्वरित और कुशलता से कार्य करने के लिए तैयार रहें।"
        },
        {
            qE: "Search and rescue operations, providing first aid, and distributing food immediately AFTER a disaster happens is part of:",
            qH: "आपदा आने के तुरंत बाद (AFTER) खोज और बचाव अभियान, प्राथमिक चिकित्सा प्रदान करना और भोजन वितरित करना किसका हिस्सा है?",
            options: [
                { e: "Mitigation", h: "न्यूनीकरण", correct: false },
                { e: "Response", h: "प्रतिक्रिया (Response)", correct: true },
                { e: "Preparedness", h: "तैयारी", correct: false },
                { e: "Prevention", h: "निवारण", correct: false }
            ],
            expE: "The 'Response' phase focuses on immediate, life-saving actions taken right after the disaster occurs.",
            expH: "'प्रतिक्रिया' (Response) चरण आपदा के तुरंत बाद की जाने वाली तत्काल, जीवन रक्षक कार्रवाइयों पर केंद्रित है।"
        },
        {
            qE: "Rebuilding destroyed infrastructure, restoring power, and helping people return to normal life takes place during the ________ phase.",
            qH: "नष्ट हुए बुनियादी ढांचे का पुनर्निर्माण, बिजली बहाल करना और लोगों को सामान्य जीवन में लौटने में मदद करना ________ चरण के दौरान होता है।",
            options: [
                { e: "Response", h: "प्रतिक्रिया", correct: false },
                { e: "Mitigation", h: "न्यूनीकरण", correct: false },
                { e: "Recovery", h: "पुनर्प्राप्ति/बहाली (Recovery)", correct: true },
                { e: "Preparedness", h: "तैयारी", correct: false }
            ],
            expE: "Recovery (and rehabilitation) is a long-term process to restore the affected area to its previous or better state.",
            expH: "पुनर्प्राप्ति (और पुनर्वास) प्रभावित क्षेत्र को उसकी पिछली या बेहतर स्थिति में बहाल करने की एक दीर्घकालिक प्रक्रिया है।"
        },
        {
            qE: "What does 'Vulnerability' mean in the context of disasters?",
            qH: "आपदाओं के संदर्भ में 'भेद्यता' (Vulnerability) का क्या अर्थ है?",
            options: [
                { e: "The strength of a building", h: "एक इमारत की ताकत", correct: false },
                { e: "The characteristics of a community or system that make it susceptible to the damaging effects of a hazard", h: "किसी समुदाय या प्रणाली की वे विशेषताएं जो उसे किसी खतरे के हानिकारक प्रभावों के प्रति संवेदनशील (susceptible) बनाती हैं", correct: true },
                { e: "The speed of a tsunami", h: "सुनामी की गति", correct: false },
                { e: "The amount of rainfall", h: "वर्षा की मात्रा", correct: false }
            ],
            expE: "Vulnerability depends on factors like poverty, poor housing, and lack of warning systems. E.g., a slum is more vulnerable to earthquakes than a well-built society.",
            expH: "भेद्यता गरीबी, खराब आवास और चेतावनी प्रणालियों की कमी जैसे कारकों पर निर्भर करती है। उदाहरण के लिए, अच्छी तरह से निर्मित समाज की तुलना में मलिन बस्ती (slum) भूकंप के प्रति अधिक संवेदनशील होती है।"
        },
        {
            qE: "A natural event (like a heavy rainstorm) only becomes a 'Disaster' when it:",
            qH: "एक प्राकृतिक घटना (जैसे भारी बारिश) 'आपदा' तभी बनती है जब यह:",
            options: [
                { e: "Happens at night", h: "रात में होती है", correct: false },
                { e: "Strikes a vulnerable human population causing significant damage and loss", h: "एक संवेदनशील मानव आबादी पर हमला करती है जिससे महत्वपूर्ण क्षति और नुकसान होता है", correct: true },
                { e: "Is shown on television", h: "टेलीविजन पर दिखाई जाती है", correct: false },

    const quizContainer = document.getElementById('quiz-container');
    const progressGrid = document.getElementById('progress-grid');
    const scoreElement = document.getElementById('current-score');
    let currentScore = 0;

    function initQuiz() {
        quizData.forEach((q, index) => {
            const qNum = index + 1;
            
            // 1. Create Progress Dot
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id = `dot-${qNum}`;
            dot.innerText = qNum;
            progressGrid.appendChild(dot);

            // 2. Create Question Card
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${qNum}`;

            // Header Texts (Eng/Hin)
            const headerHTML = `
                <div class="bilingual-text">
                    <div class="text-eng">${qNum}. ${q.qE}</div>
                    <div class="text-hin">${q.qH}</div>
                </div>
                <div class="options-grid" id="options-${qNum}"></div>
                <div class="explanation-box" id="exp-${qNum}"></div>
            `;
            card.innerHTML = headerHTML;
            quizContainer.appendChild(card);

            // Options logic
            const optionsContainer = document.getElementById(`options-${qNum}`);
            const expBox = document.getElementById(`exp-${qNum}`);

            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <span class="opt-eng">${String.fromCharCode(65 + optIndex)}. ${opt.e}</span>
                    <span class="opt-hin">${opt.h}</span>
                `;
                
                btn.onclick = () => handleAnswer(btn, qNum, opt.correct, q, optionsContainer, expBox);
                optionsContainer.appendChild(btn);
            });
        });
    }

    function handleAnswer(selectedBtn, qNum, isCorrect, qData, optionsContainer, expBox) {
        // Disable all buttons in this question
        const allBtns = optionsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        const dot = document.getElementById(`dot-${qNum}`);

        if (isCorrect) {
            selectedBtn.classList.add('correct-ans');
            expBox.classList.add('correct');
            expBox.innerHTML = `
                <div class="exp-title">✓ Correct! / सही उत्तर!</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('correct');
            currentScore++;
            scoreElement.innerText = currentScore;
        } else {
            selectedBtn.classList.add('wrong-ans');
            expBox.classList.add('wrong');
            
            // Find and highlight correct answer
            allBtns.forEach((btn, idx) => {
                if(qData.options[idx].correct) {
                    btn.classList.add('correct-ans');
                }
            });

            expBox.innerHTML = `
                <div class="exp-title">✕ Incorrect / गलत उत्तर</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('wrong');
        }

        expBox.style.display = 'block';
    }

    // Render on load
    window.onload = initQuiz;
</script>
