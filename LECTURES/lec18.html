<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 18 Quiz - SIMT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal-light: #00b4db;
            --teal-dark: #0083b0;
            --black-main: #0f172a;
            --black-card: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --bg-body: linear-gradient(135deg, #000000 0%, #0f2027 50%, #203a43 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
            background: var(--bg-body);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .layout-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            gap: 30px;
            position: relative;
        }

        /* Sidebar Tracker */
        .sidebar {
            flex: 0 0 320px;
            position: sticky;
            top: 20px;
            height: calc(100vh - 40px);
            background: linear-gradient(160deg, #0a0a0a 0%, #004d40 100%);
            border: 1px solid rgba(0, 180, 219, 0.2);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--teal-light); border-radius: 10px; }

        /* Home Button */
        .home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--teal-light);
            border: 1px solid var(--teal-dark);
            padding: 10px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: var(--teal-light);
            color: var(--black-main);
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.4);
        }

        .home-btn svg {
            width: 18px;
            height: 18px;
        }

        .college-info {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .college-info h1 {
            font-size: 2.2rem;
            background: -webkit-linear-gradient(var(--teal-light), var(--teal-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .instructor-badge {
            display: inline-block;
            background: rgba(0, 180, 219, 0.15);
            border: 1px solid var(--teal-dark);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
            color: var(--teal-light);
        }

        .score-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-title {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 180, 219, 0.5);
        }

        .progress-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: auto;
        }

        .dot {
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .dot.active { border-color: var(--teal-light); color: #fff; box-shadow: 0 0 10px rgba(0,180,219,0.3); }
        .dot.correct { background: var(--success); border-color: var(--success); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .dot.wrong { background: var(--danger); border-color: var(--danger); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        /* Quiz Main Content */
        .main-content {
            flex: 1;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .lecture-header {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--teal-dark);
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .lecture-header h2 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .lecture-header p {
            color: var(--teal-light);
            font-size: 1rem;
        }

        .question-card {
            background: var(--black-card);
            border-radius: 15px;
            padding: 30px;
            border-left: 4px solid var(--teal-dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .bilingual-text {
            margin-bottom: 20px;
        }

        .text-eng {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .text-hin {
            font-size: 1.05rem;
            color: var(--teal-light);
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 180, 219, 0.1);
            border-color: var(--teal-light);
            transform: translateX(5px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn.correct-ans {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            opacity: 1;
        }

        .option-btn.wrong-ans {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            opacity: 1;
        }

        .opt-eng { font-weight: 500; margin-bottom: 4px; }
        .opt-hin { font-size: 0.9rem; color: var(--text-dim); }

        /* Explanations */
        .explanation-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideDown 0.4s ease forwards;
        }

        .explanation-box.correct { background: rgba(16, 185, 129, 0.1); border-left: 3px solid var(--success); }
        .explanation-box.wrong { background: rgba(239, 68, 68, 0.1); border-left: 3px solid var(--danger); }

        .exp-title { font-weight: 600; margin-bottom: 10px; font-size: 1.1rem; }
        .explanation-box.correct .exp-title { color: var(--success); }
        .explanation-box.wrong .exp-title { color: var(--danger); }

        .exp-content-eng { margin-bottom: 8px; font-size: 0.95rem; line-height: 1.5; }
        .exp-content-hin { color: var(--teal-light); font-size: 0.95rem; line-height: 1.5; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .layout-container { flex-direction: column; }
            .sidebar { 
                position: relative; 
                top: 0; 
                height: auto; 
                flex: none; 
                width: 100%; 
                border-radius: 15px;
                padding: 20px;
            }
            .progress-grid { grid-template-columns: repeat(10, 1fr); margin-top: 20px; }
            .score-display { font-size: 2.5rem; }
        }

        @media (max-width: 600px) {
            .progress-grid { grid-template-columns: repeat(5, 1fr); }
            .college-info h1 { font-size: 1.8rem; }
            .text-eng { font-size: 1.05rem; }
            .text-hin { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="layout-container">
    <!-- Tracker Sidebar -->
    <aside class="sidebar">
        <!-- Home Button -->
        <a href="index.html" class="home-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Back to Main Course Page
        </a>

        <div class="college-info">
            <h1>SIMT</h1>
            <div style="font-size: 1.1rem; font-weight: 500; margin-top: 5px;">BBA / BCA 1st Year</div>
            <div style="color: var(--text-dim); font-size: 0.9rem;">Environmental Science</div>
            <div class="instructor-badge">Instructor: HARIS SAIFI</div>
        </div>

        <div class="score-section">
            <div class="score-title">
                स्कोर / Score
            </div>
            <div class="score-display">
                <span id="current-score">0</span><span style="font-size: 1.5rem; color: var(--text-dim);">/20</span>
            </div>
        </div>

        <div class="score-title" style="text-align: center; font-size: 1rem;">
            प्रगति / Progress
        </div>
        <div class="progress-grid" id="progress-grid">
            <!-- JS will generate 20 dots here -->
        </div>
    </aside>

    <!-- Quiz Content -->
    <main class="main-content">
        
        <div class="lecture-header">
            <h2>Lecture 18: Environmental Legislation</h2>
            <p>Overview of Key Laws and the Judiciary's Role</p>
        </div>

        <div id="quiz-container" style="display: flex; flex-direction: column; gap: 25px;">
            <!-- JS will generate questions here -->
        </div>
    </main>
</div>

<script>
    const quizData = [
        {
            qE: "What does the term 'Legislation' mean in the context of the environment?",
            qH: "पर्यावरण के संदर्भ में 'विधान' (Legislation) शब्द का क्या अर्थ है?",
            options: [
                { e: "Planting trees", h: "पेड़ लगाना", correct: false },
                { e: "Laws and rules created by the government to protect nature", h: "प्रकृति की रक्षा के लिए सरकार द्वारा बनाए गए कानून और नियम", correct: true },
                { e: "Scientific experiments", h: "वैज्ञानिक प्रयोग", correct: false },
                { e: "Public awareness campaigns", h: "जन जागरूकता अभियान", correct: false }
            ],
            expE: "Environmental legislation refers to the set of laws and regulations established to manage and protect the environment.",
            expH: "पर्यावरण विधान से तात्पर्य पर्यावरण के प्रबंधन और संरक्षण के लिए स्थापित कानूनों और विनियमों के समूह से है।"
        },
        {
            qE: "Which major international conference in 1972 heavily influenced India to pass strict environmental laws?",
            qH: "1972 में किस प्रमुख अंतर्राष्ट्रीय सम्मेलन ने भारत को सख्त पर्यावरण कानून पारित करने के लिए अत्यधिक प्रभावित किया?",
            options: [
                { e: "The Paris Agreement", h: "पेरिस समझौता", correct: false },
                { e: "The Stockholm Conference", h: "स्टॉकहोम सम्मेलन", correct: true },
                { e: "The Kyoto Protocol", h: "क्योटो प्रोटोकॉल", correct: false },
                { e: "The Rio Earth Summit", h: "रियो पृथ्वी सम्मेलन", correct: false }
            ],
            expE: "The UN Conference on the Human Environment (Stockholm, 1972) was the first major conference on environmental issues, prompting India to act.",
            expH: "मानव पर्यावरण पर संयुक्त राष्ट्र सम्मेलन (स्टॉकहोम, 1972) पर्यावरणीय मुद्दों पर पहला बड़ा सम्मेलन था, जिसने भारत को कार्रवाई करने के लिए प्रेरित किया।"
        },
        {
            qE: "The original Constitution of India (adopted in 1950) did not have direct provisions for environmental protection. It was added by which Amendment?",
            qH: "भारत के मूल संविधान (1950 में अपनाया गया) में पर्यावरण संरक्षण के लिए प्रत्यक्ष प्रावधान नहीं थे। इसे किस संशोधन (Amendment) द्वारा जोड़ा गया था?",
            options: [
                { e: "42nd Amendment (1976)", h: "42वां संशोधन (1976)", correct: true },
                { e: "44th Amendment", h: "44वां संशोधन", correct: false },
                { e: "73rd Amendment", h: "73वां संशोधन", correct: false },
                { e: "86th Amendment", h: "86वां संशोधन", correct: false }
            ],
            expE: "The 42nd Amendment (1976) introduced specific environmental protection duties for both the State and the citizens.",
            expH: "42वें संशोधन (1976) ने राज्य और नागरिकों दोनों के लिए विशिष्ट पर्यावरण संरक्षण कर्तव्य पेश किए।"
        },
        {
            qE: "Which Article of the Indian Constitution states that 'The State shall endeavor to protect and improve the environment and to safeguard the forests and wildlife of the country'?",
            qH: "भारतीय संविधान का कौन सा अनुच्छेद कहता है कि 'राज्य पर्यावरण की रक्षा और उसमें सुधार करने और देश के जंगलों और वन्यजीवों की रक्षा करने का प्रयास करेगा'?",
            options: [
                { e: "Article 21", h: "अनुच्छेद 21", correct: false },
                { e: "Article 48A", h: "अनुच्छेद 48A", correct: true },
                { e: "Article 14", h: "अनुच्छेद 14", correct: false },
                { e: "Article 370", h: "अनुच्छेद 370", correct: false }
            ],
            expE: "Article 48A falls under the Directive Principles of State Policy, guiding the government to protect nature.",
            expH: "अनुच्छेद 48A राज्य के नीति निर्देशक सिद्धांतों के अंतर्गत आता है, जो सरकार को प्रकृति की रक्षा के लिए मार्गदर्शन करता है।"
        },
        {
            qE: "Which Article of the Indian Constitution makes it a Fundamental Duty of every citizen 'to protect and improve the natural environment'?",
            qH: "भारतीय संविधान का कौन सा अनुच्छेद प्रत्येक नागरिक का मौलिक कर्तव्य (Fundamental Duty) बनाता है कि वह 'प्राकृतिक पर्यावरण की रक्षा और सुधार करे'?",
            options: [
                { e: "Article 19", h: "अनुच्छेद 19", correct: false },
                { e: "Article 32", h: "अनुच्छेद 32", correct: false },
                { e: "Article 51A (g)", h: "अनुच्छेद 51A (g)", correct: true },
                { e: "Article 371", h: "अनुच्छेद 371", correct: false }
            ],
            expE: "Article 51A(g) places a duty on all Indian citizens to protect forests, lakes, rivers, wildlife, and have compassion for living creatures.",
            expH: "अनुच्छेद 51A(g) सभी भारतीय नागरिकों पर जंगलों, झीलों, नदियों, वन्यजीवों की रक्षा करने और जीवित प्राणियों के प्रति दया रखने का कर्तव्य डालता है।"
        },
        {
            qE: "What is the full form of 'NGT' in India?",
            qH: "भारत में 'NGT' का पूर्ण रूप क्या है?",
            options: [
                { e: "National Green Tribunal", h: "नेशनल ग्रीन ट्रिब्यूनल (National Green Tribunal)", correct: true },
                { e: "National Growth Trust", h: "नेशनल ग्रोथ ट्रस्ट", correct: false },
                { e: "Nature Guardian Team", h: "नेचर गार्जियन टीम", correct: false },
                { e: "New Global Treaty", h: "न्यू ग्लोबल ट्रीटी", correct: false }
            ],
            expE: "The NGT is a specialized judicial body equipped with expertise solely for the purpose of adjudicating environmental cases in the country.",
            expH: "NGT एक विशिष्ट न्यायिक निकाय है जो देश में केवल पर्यावरण से संबंधित मामलों के निपटारे के लिए विशेषज्ञता से लैस है।"
        },
        {
            qE: "In which year was the National Green Tribunal (NGT) established?",
            qH: "नेशनल ग्रीन ट्रिब्यूनल (NGT) की स्थापना किस वर्ष हुई थी?",
            options: [
                { e: "1986", h: "1986", correct: false },
                { e: "2010", h: "2010", correct: true },
                { e: "1974", h: "1974", correct: false },
                { e: "2020", h: "2020", correct: false }
            ],
            expE: "The NGT was established on 18th October 2010 under the National Green Tribunal Act 2010.",
            expH: "NGT की स्थापना 18 अक्टूबर 2010 को राष्ट्रीय हरित अधिकरण (NGT) अधिनियम 2010 के तहत की गई थी।"
        },
        {
            qE: "What is the primary role of the Indian Judiciary (Supreme Court and High Courts) in environmental protection?",
            qH: "पर्यावरण संरक्षण में भारतीय न्यायपालिका (सुप्रीम कोर्ट और हाई कोर्ट) की प्राथमिक भूमिका क्या है?",
            options: [
                { e: "To manufacture solar panels", h: "सौर पैनल बनाने के लिए", correct: false },
                { e: "To enforce environmental laws and punish violators", h: "पर्यावरण कानूनों को लागू करना और उल्लंघनकर्ताओं को दंडित करना", correct: true },
                { e: "To plant trees in cities", h: "शहरों में पेड़ लगाना", correct: false },
                { e: "To collect garbage from streets", h: "सड़कों से कूड़ा इकट्ठा करना", correct: false }
            ],
            expE: "The courts interpret laws, give landmark judgments (like closing polluting factories), and hold governments and industries accountable.",
            expH: "अदालतें कानूनों की व्याख्या करती हैं, ऐतिहासिक फैसले (जैसे प्रदूषण फैलाने वाले कारखानों को बंद करना) देती हैं, और सरकारों और उद्योगों को जवाबदेह ठहराती हैं।"
        },
        {
            qE: "Citizens can file cases in the Supreme Court directly for the protection of the environment for the public good. This tool is known as:",
            qH: "जनता की भलाई के लिए पर्यावरण की रक्षा हेतु नागरिक सीधे सुप्रीम कोर्ट में मामले दर्ज कर सकते हैं। इस उपकरण को क्या कहा जाता है?",
            options: [
                { e: "FIR (First Information Report)", h: "एफआईआर (प्रथम सूचना रिपोर्ट)", correct: false },
                { e: "PIL (Public Interest Litigation)", h: "पीआईएल (जनहित याचिका - Public Interest Litigation)", correct: true },
                { e: "RTI (Right to Information)", h: "आरटीआई (सूचना का अधिकार)", correct: false },
                { e: "GST (Goods and Services Tax)", h: "जीएसटी (वस्तु एवं सेवा कर)", correct: false }
            ],
            expE: "PILs allow anyone to approach the courts to seek justice on behalf of the environment and communities affected by pollution.",
            expH: "जनहित याचिका (PIL) किसी को भी प्रदूषण से प्रभावित पर्यावरण और समुदायों की ओर से न्याय मांगने के लिए अदालतों से संपर्क करने की अनुमति देती है।"
        },
        {
            qE: "Which famous Indian environmental lawyer filed numerous PILs resulting in landmark judgments, like protecting the Taj Mahal from air pollution?",

    const quizContainer = document.getElementById('quiz-container');
    const progressGrid = document.getElementById('progress-grid');
    const scoreElement = document.getElementById('current-score');
    let currentScore = 0;

    function initQuiz() {
        quizData.forEach((q, index) => {
            const qNum = index + 1;
            
            // 1. Create Progress Dot
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id = `dot-${qNum}`;
            dot.innerText = qNum;
            progressGrid.appendChild(dot);

            // 2. Create Question Card
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${qNum}`;

            // Header Texts (Eng/Hin)
            const headerHTML = `
                <div class="bilingual-text">
                    <div class="text-eng">${qNum}. ${q.qE}</div>
                    <div class="text-hin">${q.qH}</div>
                </div>
                <div class="options-grid" id="options-${qNum}"></div>
                <div class="explanation-box" id="exp-${qNum}"></div>
            `;
            card.innerHTML = headerHTML;
            quizContainer.appendChild(card);

            // Options logic
            const optionsContainer = document.getElementById(`options-${qNum}`);
            const expBox = document.getElementById(`exp-${qNum}`);

            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <span class="opt-eng">${String.fromCharCode(65 + optIndex)}. ${opt.e}</span>
                    <span class="opt-hin">${opt.h}</span>
                `;
                
                btn.onclick = () => handleAnswer(btn, qNum, opt.correct, q, optionsContainer, expBox);
                optionsContainer.appendChild(btn);
            });
        });
    }

    function handleAnswer(selectedBtn, qNum, isCorrect, qData, optionsContainer, expBox) {
        // Disable all buttons in this question
        const allBtns = optionsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        const dot = document.getElementById(`dot-${qNum}`);

        if (isCorrect) {
            selectedBtn.classList.add('correct-ans');
            expBox.classList.add('correct');
            expBox.innerHTML = `
                <div class="exp-title">✓ Correct! / सही उत्तर!</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('correct');
            currentScore++;
            scoreElement.innerText = currentScore;
        } else {
            selectedBtn.classList.add('wrong-ans');
            expBox.classList.add('wrong');
            
            // Find and highlight correct answer
            allBtns.forEach((btn, idx) => {
                if(qData.options[idx].correct) {
                    btn.classList.add('correct-ans');
                }
            });

            expBox.innerHTML = `
                <div class="exp-title">✕ Incorrect / गलत उत्तर</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('wrong');
        }

        expBox.style.display = 'block';
    }

    // Render on load
    window.onload = initQuiz;
</script>
