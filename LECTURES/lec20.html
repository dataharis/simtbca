<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 20 Quiz - SIMT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal-light: #00b4db;
            --teal-dark: #0083b0;
            --black-main: #0f172a;
            --black-card: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --bg-body: linear-gradient(135deg, #000000 0%, #0f2027 50%, #203a43 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
            background: var(--bg-body);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .layout-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            gap: 30px;
            position: relative;
        }

        /* Sidebar Tracker */
        .sidebar {
            flex: 0 0 320px;
            position: sticky;
            top: 20px;
            height: calc(100vh - 40px);
            background: linear-gradient(160deg, #0a0a0a 0%, #004d40 100%);
            border: 1px solid rgba(0, 180, 219, 0.2);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--teal-light); border-radius: 10px; }

        /* Home Button */
        .home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--teal-light);
            border: 1px solid var(--teal-dark);
            padding: 10px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: var(--teal-light);
            color: var(--black-main);
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.4);
        }

        .home-btn svg {
            width: 18px;
            height: 18px;
        }

        .college-info {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .college-info h1 {
            font-size: 2.2rem;
            background: -webkit-linear-gradient(var(--teal-light), var(--teal-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .instructor-badge {
            display: inline-block;
            background: rgba(0, 180, 219, 0.15);
            border: 1px solid var(--teal-dark);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
            color: var(--teal-light);
        }

        .score-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-title {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 180, 219, 0.5);
        }

        .progress-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: auto;
        }

        .dot {
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .dot.active { border-color: var(--teal-light); color: #fff; box-shadow: 0 0 10px rgba(0,180,219,0.3); }
        .dot.correct { background: var(--success); border-color: var(--success); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .dot.wrong { background: var(--danger); border-color: var(--danger); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        /* Quiz Main Content */
        .main-content {
            flex: 1;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .lecture-header {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--teal-dark);
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .lecture-header h2 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .lecture-header p {
            color: var(--teal-light);
            font-size: 1rem;
        }

        .question-card {
            background: var(--black-card);
            border-radius: 15px;
            padding: 30px;
            border-left: 4px solid var(--teal-dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .bilingual-text {
            margin-bottom: 20px;
        }

        .text-eng {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .text-hin {
            font-size: 1.05rem;
            color: var(--teal-light);
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 180, 219, 0.1);
            border-color: var(--teal-light);
            transform: translateX(5px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn.correct-ans {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            opacity: 1;
        }

        .option-btn.wrong-ans {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            opacity: 1;
        }

        .opt-eng { font-weight: 500; margin-bottom: 4px; }
        .opt-hin { font-size: 0.9rem; color: var(--text-dim); }

        /* Explanations */
        .explanation-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideDown 0.4s ease forwards;
        }

        .explanation-box.correct { background: rgba(16, 185, 129, 0.1); border-left: 3px solid var(--success); }
        .explanation-box.wrong { background: rgba(239, 68, 68, 0.1); border-left: 3px solid var(--danger); }

        .exp-title { font-weight: 600; margin-bottom: 10px; font-size: 1.1rem; }
        .explanation-box.correct .exp-title { color: var(--success); }
        .explanation-box.wrong .exp-title { color: var(--danger); }

        .exp-content-eng { margin-bottom: 8px; font-size: 0.95rem; line-height: 1.5; }
        .exp-content-hin { color: var(--teal-light); font-size: 0.95rem; line-height: 1.5; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .layout-container { flex-direction: column; }
            .sidebar { 
                position: relative; 
                top: 0; 
                height: auto; 
                flex: none; 
                width: 100%; 
                border-radius: 15px;
                padding: 20px;
            }
            .progress-grid { grid-template-columns: repeat(10, 1fr); margin-top: 20px; }
            .score-display { font-size: 2.5rem; }
        }

        @media (max-width: 600px) {
            .progress-grid { grid-template-columns: repeat(5, 1fr); }
            .college-info h1 { font-size: 1.8rem; }
            .text-eng { font-size: 1.05rem; }
            .text-hin { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="layout-container">
    <!-- Tracker Sidebar -->
    <aside class="sidebar">
        <!-- Home Button -->
        <a href="index.html" class="home-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Back to Main Course Page
        </a>

        <div class="college-info">
            <h1>SIMT</h1>
            <div style="font-size: 1.1rem; font-weight: 500; margin-top: 5px;">BBA / BCA 1st Year</div>
            <div style="color: var(--text-dim); font-size: 0.9rem;">Environmental Science</div>
            <div class="instructor-badge">Instructor: HARIS SAIFI</div>
        </div>

        <div class="score-section">
            <div class="score-title">
                स्कोर / Score
            </div>
            <div class="score-display">
                <span id="current-score">0</span><span style="font-size: 1.5rem; color: var(--text-dim);">/20</span>
            </div>
        </div>

        <div class="score-title" style="text-align: center; font-size: 1rem;">
            प्रगति / Progress
        </div>
        <div class="progress-grid" id="progress-grid">
            <!-- JS will generate 20 dots here -->
        </div>
    </aside>

    <!-- Quiz Content -->
    <main class="main-content">
        
        <div class="lecture-header">
            <h2>Lecture 20: The Air Act, 1981</h2>
            <p>Prevention and Control of Pollution Act (Including 1987 Amendment)</p>
        </div>

        <div id="quiz-container" style="display: flex; flex-direction: column; gap: 25px;">
            <!-- JS will generate questions here -->
        </div>
    </main>
</div>

<script>
    const quizData = [
        {
            qE: "In which year was the Air (Prevention and Control of Pollution) Act enacted in India?",
            qH: "भारत में वायु (प्रदूषण निवारण और नियंत्रण) अधिनियम किस वर्ष लागू किया गया था?",
            options: [
                { e: "1974", h: "1974", correct: false },
                { e: "1981", h: "1981", correct: true },
                { e: "1986", h: "1986", correct: false },
                { e: "1990", h: "1990", correct: false }
            ],
            expE: "The Air Act was passed in 1981 specifically to combat the growing problem of air pollution in India.",
            expH: "भारत में वायु प्रदूषण की बढ़ती समस्या से निपटने के लिए विशेष रूप से 1981 में वायु अधिनियम पारित किया गया था।"
        },
        {
            qE: "What is the primary objective of the Air Act, 1981?",
            qH: "वायु अधिनियम, 1981 का प्राथमिक उद्देश्य क्या है?",
            options: [
                { e: "To build more airplanes", h: "अधिक हवाई जहाज बनाना", correct: false },
                { e: "To prevent, control, and abate air pollution", h: "वायु प्रदूषण को रोकना, नियंत्रित करना और कम करना", correct: true },
                { e: "To stop people from breathing deeply", h: "लोगों को गहरी सांस लेने से रोकना", correct: false },
                { e: "To sell fresh air in cylinders", h: "सिलेंडरों में ताजी हवा बेचना", correct: false }
            ],
            expE: "The main goal is to protect the quality of ambient (outdoor) air and prevent health hazards caused by polluted air.",
            expH: "मुख्य लक्ष्य परिवेशी (बाहरी) हवा की गुणवत्ता की रक्षा करना और प्रदूषित हवा के कारण होने वाले स्वास्थ्य खतरों को रोकना है।"
        },
        {
            qE: "In a landmark amendment to the Air Act in 1987, which specific pollutant was officially included under the definition of 'Air Pollutant'?",
            qH: "1987 में वायु अधिनियम में एक ऐतिहासिक संशोधन में, किस विशिष्ट प्रदूषक को आधिकारिक तौर पर 'वायु प्रदूषक' की परिभाषा के तहत शामिल किया गया था?",
            options: [
                { e: "Plastic waste", h: "प्लास्टिक कचरा", correct: false },
                { e: "Noise pollution", h: "ध्वनि प्रदूषण", correct: true },
                { e: "River water", h: "नदी का पानी", correct: false },
                { e: "Radioactive waste", h: "रेडियोधर्मी कचरा", correct: false }
            ],
            expE: "The 1987 amendment explicitly added 'noise' as an air pollutant because loud, continuous noise is a severe environmental hazard.",
            expH: "1987 के संशोधन ने स्पष्ट रूप से 'शोर' को वायु प्रदूषक के रूप में जोड़ा क्योंकि तेज, निरंतर शोर एक गंभीर पर्यावरणीय खतरा है।"
        },
        {
            qE: "According to the Air Act, what defines an 'Air Pollutant'?",
            qH: "वायु अधिनियम के अनुसार, 'वायु प्रदूषक' (Air Pollutant) को क्या परिभाषित करता है?",
            options: [
                { e: "Any solid, liquid, or gaseous substance present in the atmosphere that may be harmful to living beings or property", h: "वायुमंडल में मौजूद कोई भी ठोस, तरल या गैसीय पदार्थ जो जीवित प्राणियों या संपत्ति के लिए हानिकारक हो सकता है", correct: true },
                { e: "Only smoke coming from factories", h: "केवल कारखानों से निकलने वाला धुआं", correct: false },
                { e: "Only gases that smell bad", h: "केवल वे गैसें जिनसे दुर्गंध आती है", correct: false },
                { e: "Natural clouds in the sky", h: "आसमान में प्राकृतिक बादल", correct: false }
            ],
            expE: "The legal definition covers all forms of matter (including dust and noise) that reach harmful concentrations in the air.",
            expH: "कानूनी परिभाषा में पदार्थ के सभी रूप (धूल और शोर सहित) शामिल हैं जो हवा में हानिकारक सांद्रता (concentration) तक पहुंचते हैं।"
        },
        {
            qE: "Which authorities are responsible for implementing the Air Act, 1981 at the central and state levels?",
            qH: "केंद्र और राज्य स्तर पर वायु अधिनियम, 1981 को लागू करने के लिए कौन से प्राधिकरण (authorities) जिम्मेदार हैं?",
            options: [
                { e: "The Police Departments", h: "पुलिस विभाग", correct: false },
                { e: "The Central Pollution Control Board (CPCB) and State Pollution Control Boards (SPCB)", h: "केंद्रीय प्रदूषण नियंत्रण बोर्ड (CPCB) और राज्य प्रदूषण नियंत्रण बोर्ड (SPCB)", correct: true },
                { e: "The Health Ministry", h: "स्वास्थ्य मंत्रालय", correct: false },
                { e: "The Forest Rangers", h: "वन रेंजर", correct: false }
            ],
            expE: "The same boards (CPCB and SPCB) created under the Water Act (1974) were given the power to enforce the Air Act.",
            expH: "जल अधिनियम (1974) के तहत बनाए गए उन्हीं बोर्डों (CPCB और SPCB) को वायु अधिनियम लागू करने की शक्ति दी गई थी।"
        },
        {
            qE: "Under Section 19 of the Act, what special power does the State Government have (in consultation with the SPCB)?",
            qH: "अधिनियम की धारा 19 के तहत, राज्य सरकार के पास (SPCB के परामर्श से) क्या विशेष शक्ति है?",
            options: [
                { e: "To ban the use of oxygen", h: "ऑक्सीजन के उपयोग पर प्रतिबंध लगाना", correct: false },
                { e: "To declare any specific region as an 'Air Pollution Control Area'", h: "किसी भी विशिष्ट क्षेत्र को 'वायु प्रदूषण नियंत्रण क्षेत्र' घोषित करना", correct: true },
                { e: "To force citizens to plant 100 trees daily", h: "नागरिकों को प्रतिदिन 100 पेड़ लगाने के लिए मजबूर करना", correct: false },
                { e: "To permanently close all roads", h: "सभी सड़कों को स्थायी रूप से बंद करना", correct: false }
            ],
            expE: "In an 'Air Pollution Control Area', the government can enforce stricter rules, like banning the burning of certain highly polluting fuels.",
            expH: "'वायु प्रदूषण नियंत्रण क्षेत्र' में, सरकार सख्त नियम लागू कर सकती है, जैसे कि कुछ अत्यधिक प्रदूषणकारी ईंधनों को जलाने पर प्रतिबंध लगाना।"
        },
        {
            qE: "Before opening a new industrial plant in an Air Pollution Control Area, what is a mandatory requirement?",
            qH: "वायु प्रदूषण नियंत्रण क्षेत्र में नया औद्योगिक संयंत्र खोलने से पहले, अनिवार्य आवश्यकता क्या है?",
            options: [
                { e: "Obtaining prior consent (license) from the State Pollution Control Board", h: "राज्य प्रदूषण नियंत्रण बोर्ड से पूर्व सहमति (लाइसेंस) प्राप्त करना", correct: true },
                { e: "Painting the factory green", h: "कारखाने को हरे रंग में रंगना", correct: false },
                { e: "Asking permission from local villagers only", h: "केवल स्थानीय ग्रामीणों से अनुमति मांगना", correct: false },
                { e: "Buying a large piece of land", h: "जमीन का एक बड़ा टुकड़ा खरीदना", correct: false }
            ],
            expE: "Under Section 21, no person can establish or operate an industrial plant without the previous consent of the SPCB.",
            expH: "धारा 21 के तहत, कोई भी व्यक्ति SPCB की पूर्व सहमति के बिना औद्योगिक संयंत्र स्थापित या संचालित नहीं कर सकता है।"
        },
        {
            qE: "Can the State Pollution Control Board (SPCB) restrict the use of certain fuels in a declared area?",
            qH: "क्या राज्य प्रदूषण नियंत्रण बोर्ड (SPCB) घोषित क्षेत्र में कुछ ईंधनों के उपयोग को प्रतिबंधित कर सकता है?",
            options: [
                { e: "No, industries can use any fuel they want", h: "नहीं, उद्योग जो चाहें ईंधन इस्तेमाल कर सकते हैं", correct: false },
                { e: "Yes, they can prohibit the use of highly polluting fuels or the burning of certain waste materials", h: "हां, वे अत्यधिक प्रदूषण फैलाने वाले ईंधन के उपयोग या कुछ अपशिष्ट पदार्थों को जलाने पर रोक लगा सकते हैं", correct: true },
                { e: "Only if the fuel is very expensive", h: "केवल तभी जब ईंधन बहुत महंगा हो", correct: false },
                { e: "Only for one day a year", h: "साल में सिर्फ एक दिन के लिए", correct: false }
            ],
            expE: "The SPCB can issue directives to ban fuels (like cheap, high-sulfur coal) to maintain air quality standards.",
            expH: "SPCB वायु गुणवत्ता मानकों को बनाए रखने के लिए ईंधन (जैसे सस्ता, उच्च सल्फर वाला कोयला) पर प्रतिबंध लगाने के निर्देश जारी कर सकता है।"
        },
        {
            qE: "What happens if a factory owner refuses to let a Pollution Control Board officer inspect the premises?",
            qH: "यदि कोई कारखाने का मालिक प्रदूषण नियंत्रण बोर्ड के अधिकारी को परिसर का निरीक्षण करने से मना कर दे तो क्या होता है?",
            options: [

    const quizContainer = document.getElementById('quiz-container');
    const progressGrid = document.getElementById('progress-grid');
    const scoreElement = document.getElementById('current-score');
    let currentScore = 0;

    function initQuiz() {
        quizData.forEach((q, index) => {
            const qNum = index + 1;
            
            // 1. Create Progress Dot
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id = `dot-${qNum}`;
            dot.innerText = qNum;
            progressGrid.appendChild(dot);

            // 2. Create Question Card
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${qNum}`;

            // Header Texts (Eng/Hin)
            const headerHTML = `
                <div class="bilingual-text">
                    <div class="text-eng">${qNum}. ${q.qE}</div>
                    <div class="text-hin">${q.qH}</div>
                </div>
                <div class="options-grid" id="options-${qNum}"></div>
                <div class="explanation-box" id="exp-${qNum}"></div>
            `;
            card.innerHTML = headerHTML;
            quizContainer.appendChild(card);

            // Options logic
            const optionsContainer = document.getElementById(`options-${qNum}`);
            const expBox = document.getElementById(`exp-${qNum}`);

            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <span class="opt-eng">${String.fromCharCode(65 + optIndex)}. ${opt.e}</span>
                    <span class="opt-hin">${opt.h}</span>
                `;
                
                btn.onclick = () => handleAnswer(btn, qNum, opt.correct, q, optionsContainer, expBox);
                optionsContainer.appendChild(btn);
            });
        });
    }

    function handleAnswer(selectedBtn, qNum, isCorrect, qData, optionsContainer, expBox) {
        // Disable all buttons in this question
        const allBtns = optionsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        const dot = document.getElementById(`dot-${qNum}`);

        if (isCorrect) {
            selectedBtn.classList.add('correct-ans');
            expBox.classList.add('correct');
            expBox.innerHTML = `
                <div class="exp-title">✓ Correct! / सही उत्तर!</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('correct');
            currentScore++;
            scoreElement.innerText = currentScore;
        } else {
            selectedBtn.classList.add('wrong-ans');
            expBox.classList.add('wrong');
            
            // Find and highlight correct answer
            allBtns.forEach((btn, idx) => {
                if(qData.options[idx].correct) {
                    btn.classList.add('correct-ans');
                }
            });

            expBox.innerHTML = `
                <div class="exp-title">✕ Incorrect / गलत उत्तर</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('wrong');
        }

        expBox.style.display = 'block';
    }

    // Render on load
    window.onload = initQuiz;
</script>
