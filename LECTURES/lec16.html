<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 16 Quiz - SIMT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal-light: #00b4db;
            --teal-dark: #0083b0;
            --black-main: #0f172a;
            --black-card: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --bg-body: linear-gradient(135deg, #000000 0%, #0f2027 50%, #203a43 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
            background: var(--bg-body);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .layout-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            gap: 30px;
            position: relative;
        }

        /* Sidebar Tracker */
        .sidebar {
            flex: 0 0 320px;
            position: sticky;
            top: 20px;
            height: calc(100vh - 40px);
            background: linear-gradient(160deg, #0a0a0a 0%, #004d40 100%);
            border: 1px solid rgba(0, 180, 219, 0.2);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--teal-light); border-radius: 10px; }

        /* Home Button */
        .home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--teal-light);
            border: 1px solid var(--teal-dark);
            padding: 10px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: var(--teal-light);
            color: var(--black-main);
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.4);
        }

        .home-btn svg {
            width: 18px;
            height: 18px;
        }

        .college-info {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .college-info h1 {
            font-size: 2.2rem;
            background: -webkit-linear-gradient(var(--teal-light), var(--teal-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .instructor-badge {
            display: inline-block;
            background: rgba(0, 180, 219, 0.15);
            border: 1px solid var(--teal-dark);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
            color: var(--teal-light);
        }

        .score-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-title {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 180, 219, 0.5);
        }

        .progress-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: auto;
        }

        .dot {
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .dot.active { border-color: var(--teal-light); color: #fff; box-shadow: 0 0 10px rgba(0,180,219,0.3); }
        .dot.correct { background: var(--success); border-color: var(--success); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .dot.wrong { background: var(--danger); border-color: var(--danger); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        /* Quiz Main Content */
        .main-content {
            flex: 1;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .lecture-header {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--teal-dark);
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .lecture-header h2 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .lecture-header p {
            color: var(--teal-light);
            font-size: 1rem;
        }

        .question-card {
            background: var(--black-card);
            border-radius: 15px;
            padding: 30px;
            border-left: 4px solid var(--teal-dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .bilingual-text {
            margin-bottom: 20px;
        }

        .text-eng {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .text-hin {
            font-size: 1.05rem;
            color: var(--teal-light);
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 180, 219, 0.1);
            border-color: var(--teal-light);
            transform: translateX(5px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn.correct-ans {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            opacity: 1;
        }

        .option-btn.wrong-ans {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            opacity: 1;
        }

        .opt-eng { font-weight: 500; margin-bottom: 4px; }
        .opt-hin { font-size: 0.9rem; color: var(--text-dim); }

        /* Explanations */
        .explanation-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideDown 0.4s ease forwards;
        }

        .explanation-box.correct { background: rgba(16, 185, 129, 0.1); border-left: 3px solid var(--success); }
        .explanation-box.wrong { background: rgba(239, 68, 68, 0.1); border-left: 3px solid var(--danger); }

        .exp-title { font-weight: 600; margin-bottom: 10px; font-size: 1.1rem; }
        .explanation-box.correct .exp-title { color: var(--success); }
        .explanation-box.wrong .exp-title { color: var(--danger); }

        .exp-content-eng { margin-bottom: 8px; font-size: 0.95rem; line-height: 1.5; }
        .exp-content-hin { color: var(--teal-light); font-size: 0.95rem; line-height: 1.5; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .layout-container { flex-direction: column; }
            .sidebar { 
                position: relative; 
                top: 0; 
                height: auto; 
                flex: none; 
                width: 100%; 
                border-radius: 15px;
                padding: 20px;
            }
            .progress-grid { grid-template-columns: repeat(10, 1fr); margin-top: 20px; }
            .score-display { font-size: 2.5rem; }
        }

        @media (max-width: 600px) {
            .progress-grid { grid-template-columns: repeat(5, 1fr); }
            .college-info h1 { font-size: 1.8rem; }
            .text-eng { font-size: 1.05rem; }
            .text-hin { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="layout-container">
    <!-- Tracker Sidebar -->
    <aside class="sidebar">
        <!-- Home Button -->
        <a href="index.html" class="home-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Back to Main Course Page
        </a>

        <div class="college-info">
            <h1>SIMT</h1>
            <div style="font-size: 1.1rem; font-weight: 500; margin-top: 5px;">BBA / BCA 1st Year</div>
            <div style="color: var(--text-dim); font-size: 0.9rem;">Environmental Science</div>
            <div class="instructor-badge">Instructor: HARIS SAIFI</div>
        </div>

        <div class="score-section">
            <div class="score-title">
                स्कोर / Score
            </div>
            <div class="score-display">
                <span id="current-score">0</span><span style="font-size: 1.5rem; color: var(--text-dim);">/20</span>
            </div>
        </div>

        <div class="score-title" style="text-align: center; font-size: 1rem;">
            प्रगति / Progress
        </div>
        <div class="progress-grid" id="progress-grid">
            <!-- JS will generate 20 dots here -->
        </div>
    </aside>

    <!-- Quiz Content -->
    <main class="main-content">
        
        <div class="lecture-header">
            <h2>Lecture 16: Society & Environment</h2>
            <p>Interactions, Environmental Ethics, and Sustainability</p>
        </div>

        <div id="quiz-container" style="display: flex; flex-direction: column; gap: 25px;">
            <!-- JS will generate questions here -->
        </div>
    </main>
</div>

<script>
    const quizData = [
        {
            qE: "What is 'Environmental Ethics'?",
            qH: "'पर्यावरण नैतिकता' (Environmental Ethics) क्या है?",
            options: [
                { e: "A subject about making money from forests", h: "जंगलों से पैसा कमाने के बारे में एक विषय", correct: false },
                { e: "The philosophical study of the moral relationship between human beings and the natural environment", h: "मनुष्यों और प्राकृतिक पर्यावरण के बीच नैतिक संबंध का दार्शनिक अध्ययन", correct: true },
                { e: "A guide on how to build factories", h: "कारखाने कैसे बनाएं इस पर एक गाइड", correct: false },
                { e: "The study of solar system planets", h: "सौर मंडल के ग्रहों का अध्ययन", correct: false }
            ],
            expE: "Environmental ethics helps us understand our moral duties and responsibilities toward nature.",
            expH: "पर्यावरण नैतिकता हमें प्रकृति के प्रति हमारे नैतिक कर्तव्यों और जिम्मेदारियों को समझने में मदद करती है।"
        },
        {
            qE: "Which environmental worldview believes that 'human beings are the most important entity in the universe'?",
            qH: "किस पर्यावरणीय विश्वदृष्टिकोण का मानना ​​है कि 'मनुष्य ब्रह्मांड में सबसे महत्वपूर्ण इकाई है'?",
            options: [
                { e: "Ecocentrism", h: "इकोसेंट्रिज़्म (Ecocentrism)", correct: false },
                { e: "Anthropocentrism", h: "मानवकेन्द्रवाद (Anthropocentrism)", correct: true },
                { e: "Biocentrism", h: "बायोसेंट्रिज़्म (Biocentrism)", correct: false },
                { e: "Zoocentrism", h: "ज़ूसेंट्रिज़्म", correct: false }
            ],
            expE: "Anthropocentrism puts humans at the center, often viewing nature only as a resource for human use.",
            expH: "मानवकेन्द्रवाद (Anthropocentrism) मनुष्यों को केंद्र में रखता है, और अक्सर प्रकृति को केवल मानव उपयोग के लिए एक संसाधन के रूप में देखता है।"
        },
        {
            qE: "Which worldview gives intrinsic (built-in) value to ALL living things, regardless of their usefulness to humans?",
            qH: "कौन सा विश्वदृष्टिकोण मनुष्यों के लिए उनकी उपयोगिता की परवाह किए बिना, सभी जीवित चीजों को अंतर्निहित (intrinsic) मूल्य देता है?",
            options: [
                { e: "Anthropocentrism", h: "मानवकेन्द्रवाद", correct: false },
                { e: "Technocentrism", h: "टेक्नोसेंट्रिज़्म", correct: false },
                { e: "Biocentrism", h: "बायोसेंट्रिज़्म (Biocentrism)", correct: true },
                { e: "Industrialism", h: "औद्योगीकरण", correct: false }
            ],
            expE: "Biocentrism argues that every living organism (plant, animal, microbe) has a right to exist.",
            expH: "बायोसेंट्रिज़्म (Biocentrism) का तर्क है कि हर जीवित जीव (पौधे, जानवर, सूक्ष्मजीव) को अस्तित्व का अधिकार है।"
        },
        {
            qE: "Which approach places the highest value on the entire ecosystem (including rivers, soil, and living things) as a whole?",
            qH: "कौन सा दृष्टिकोण पूरे पारिस्थितिकी तंत्र (नदियों, मिट्टी और जीवित चीजों सहित) को समग्र रूप से सर्वोच्च महत्व देता है?",
            options: [
                { e: "Ecocentrism", h: "इकोसेंट्रिज़्म (Ecocentrism)", correct: true },
                { e: "Anthropocentrism", h: "मानवकेन्द्रवाद", correct: false },
                { e: "Egocentrism", h: "अहंकारवाद (Egocentrism)", correct: false },
                { e: "Consumerism", h: "उपभोक्तावाद (Consumerism)", correct: false }
            ],
            expE: "Ecocentrism believes that the health of the entire ecological system is more important than individual parts.",
            expH: "इकोसेंट्रिज़्म (Ecocentrism) का मानना ​​है कि संपूर्ण पारिस्थितिकी तंत्र का स्वास्थ्य व्यक्तिगत भागों की तुलना में अधिक महत्वपूर्ण है।"
        },
        {
            qE: "The interaction between society and the environment is a 'two-way process'. What does this mean?",
            qH: "समाज और पर्यावरण के बीच की बातचीत एक 'दोतरफा प्रक्रिया' (two-way process) है। इसका क्या अर्थ है?",
            options: [
                { e: "Only the environment affects humans", h: "केवल पर्यावरण ही मनुष्यों को प्रभावित करता है", correct: false },
                { e: "Only humans affect the environment", h: "केवल मनुष्य ही पर्यावरण को प्रभावित करते हैं", correct: false },
                { e: "Humans modify the environment, and the changed environment in turn affects human life", h: "मनुष्य पर्यावरण को संशोधित करते हैं, और बदला हुआ पर्यावरण बदले में मानव जीवन को प्रभावित करता है", correct: true },
                { e: "Humans and the environment do not interact at all", h: "मनुष्य और पर्यावरण बिल्कुल भी संपर्क नहीं करते हैं", correct: false }
            ],
            expE: "We change nature (e.g., building cities, causing pollution), and nature reacts (e.g., floods, climate change) affecting our survival.",
            expH: "हम प्रकृति को बदलते हैं (जैसे, शहरों का निर्माण, प्रदूषण), और प्रकृति प्रतिक्रिया करती है (जैसे, बाढ़, जलवायु परिवर्तन) जो हमारे अस्तित्व को प्रभावित करती है।"
        },
        {
            qE: "What is a 'Throwaway Society'?",
            qH: "'थ्रोअवे सोसाइटी' (Throwaway Society) क्या है?",
            options: [
                { e: "A society that recycles everything", h: "एक ऐसा समाज जो हर चीज का पुनर्चक्रण (recycle) करता है", correct: false },
                { e: "A society strongly influenced by consumerism, characterized by excessive consumption and single-use products", h: "उपभोक्तावाद से अत्यधिक प्रभावित समाज, जिसकी विशेषता अत्यधिक खपत और एकल-उपयोग (single-use) उत्पाद हैं", correct: true },
                { e: "A society that lives completely in forests", h: "एक समाज जो पूरी तरह से जंगलों में रहता है", correct: false },
                { e: "A society with no factories", h: "बिना कारखानों वाला समाज", correct: false }
            ],
            expE: "Throwaway societies create massive amounts of solid waste, causing severe environmental degradation.",
            expH: "थ्रोअवे समाज भारी मात्रा में ठोस कचरा पैदा करते हैं, जिससे पर्यावरण का गंभीर क्षरण होता है।"
        },
        {
            qE: "Which environmental philosophy emphasizes completely minimizing human interference in nature?",
            qH: "कौन सा पर्यावरण दर्शन प्रकृति में मानवीय हस्तक्षेप को पूरी तरह से कम करने पर जोर देता है?",
            options: [
                { e: "Shallow Ecology", h: "शैलो इकोलॉजी (Shallow Ecology)", correct: false },
                { e: "Deep Ecology", h: "डीप इकोलॉजी (Deep Ecology)", correct: true },
                { e: "Urbanization", h: "शहरीकरण", correct: false },
                { e: "Capitalism", h: "पूंजीवाद", correct: false }
            ],
            expE: "Deep ecology argues for a radical change in human behavior to preserve nature for its own sake, not just for human use.",
            expH: "डीप इकोलॉजी मानव व्यवहार में आमूल-चूल परिवर्तन का तर्क देती है ताकि प्रकृति को केवल मानव उपयोग के लिए ही नहीं, बल्कि प्रकृति के लिए ही संरक्षित किया जा सके।"
        },
        {
            qE: "Why is 'Consumerism' a social issue in environmental science?",
            qH: "पर्यावरण विज्ञान में 'उपभोक्तावाद' (Consumerism) एक सामाजिक मुद्दा क्यों है?",
            options: [
                { e: "It leads to the over-extraction of natural resources and high waste generation", h: "इससे प्राकृतिक संसाधनों का अत्यधिक दोहन और उच्च अपशिष्ट (कचरा) उत्पादन होता है", correct: true },
                { e: "It makes products cheaper", h: "यह उत्पादों को सस्ता बनाता है", correct: false },
                { e: "It teaches people how to plant trees", h: "यह लोगों को पेड़ लगाना सिखाता है", correct: false },
                { e: "It has no connection to the environment", h: "इसका पर्यावरण से कोई संबंध नहीं है", correct: false }
            ],
            expE: "Buying more things than we need puts immense pressure on Earth's limited resources and creates more pollution.",
            expH: "अपनी जरूरत से ज्यादा चीजें खरीदने से पृथ्वी के सीमित संसाधनों पर भारी दबाव पड़ता है और अधिक प्रदूषण होता है।"
        },
        {
            qE: "The concept of 'Earth as a Spaceship' teaches us that:",
            qH: "'पृथ्वी एक अंतरिक्ष यान के रूप में' (Earth as a Spaceship) की अवधारणा हमें क्या सिखाती है?",
            options: [

    const quizContainer = document.getElementById('quiz-container');
    const progressGrid = document.getElementById('progress-grid');
    const scoreElement = document.getElementById('current-score');
    let currentScore = 0;

    function initQuiz() {
        quizData.forEach((q, index) => {
            const qNum = index + 1;
            
            // 1. Create Progress Dot
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id = `dot-${qNum}`;
            dot.innerText = qNum;
            progressGrid.appendChild(dot);

            // 2. Create Question Card
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${qNum}`;

            // Header Texts (Eng/Hin)
            const headerHTML = `
                <div class="bilingual-text">
                    <div class="text-eng">${qNum}. ${q.qE}</div>
                    <div class="text-hin">${q.qH}</div>
                </div>
                <div class="options-grid" id="options-${qNum}"></div>
                <div class="explanation-box" id="exp-${qNum}"></div>
            `;
            card.innerHTML = headerHTML;
            quizContainer.appendChild(card);

            // Options logic
            const optionsContainer = document.getElementById(`options-${qNum}`);
            const expBox = document.getElementById(`exp-${qNum}`);

            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <span class="opt-eng">${String.fromCharCode(65 + optIndex)}. ${opt.e}</span>
                    <span class="opt-hin">${opt.h}</span>
                `;
                
                btn.onclick = () => handleAnswer(btn, qNum, opt.correct, q, optionsContainer, expBox);
                optionsContainer.appendChild(btn);
            });
        });
    }

    function handleAnswer(selectedBtn, qNum, isCorrect, qData, optionsContainer, expBox) {
        // Disable all buttons in this question
        const allBtns = optionsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        const dot = document.getElementById(`dot-${qNum}`);

        if (isCorrect) {
            selectedBtn.classList.add('correct-ans');
            expBox.classList.add('correct');
            expBox.innerHTML = `
                <div class="exp-title">✓ Correct! / सही उत्तर!</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('correct');
            currentScore++;
            scoreElement.innerText = currentScore;
        } else {
            selectedBtn.classList.add('wrong-ans');
            expBox.classList.add('wrong');
            
            // Find and highlight correct answer
            allBtns.forEach((btn, idx) => {
                if(qData.options[idx].correct) {
                    btn.classList.add('correct-ans');
                }
            });

            expBox.innerHTML = `
                <div class="exp-title">✕ Incorrect / गलत उत्तर</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('wrong');
        }

        expBox.style.display = 'block';
    }

    // Render on load
    window.onload = initQuiz;
</script>
