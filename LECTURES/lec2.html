<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 2 Quiz - SIMT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal-light: #00b4db;
            --teal-dark: #0083b0;
            --black-main: #0f172a;
            --black-card: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --bg-body: linear-gradient(135deg, #000000 0%, #0f2027 50%, #203a43 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
            background: var(--bg-body);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .layout-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            gap: 30px;
            position: relative;
        }

        /* Sidebar Tracker */
        .sidebar {
            flex: 0 0 320px;
            position: sticky;
            top: 20px;
            height: calc(100vh - 40px);
            background: linear-gradient(160deg, #0a0a0a 0%, #004d40 100%);
            border: 1px solid rgba(0, 180, 219, 0.2);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--teal-light); border-radius: 10px; }

        /* Home Button */
        .home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--teal-light);
            border: 1px solid var(--teal-dark);
            padding: 10px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: var(--teal-light);
            color: var(--black-main);
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.4);
        }

        .home-btn svg {
            width: 18px;
            height: 18px;
        }

        .college-info {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .college-info h1 {
            font-size: 2.2rem;
            background: -webkit-linear-gradient(var(--teal-light), var(--teal-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .instructor-badge {
            display: inline-block;
            background: rgba(0, 180, 219, 0.15);
            border: 1px solid var(--teal-dark);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
            color: var(--teal-light);
        }

        .score-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-title {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 180, 219, 0.5);
        }

        .progress-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: auto;
        }

        .dot {
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .dot.active { border-color: var(--teal-light); color: #fff; box-shadow: 0 0 10px rgba(0,180,219,0.3); }
        .dot.correct { background: var(--success); border-color: var(--success); color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .dot.wrong { background: var(--danger); border-color: var(--danger); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }

        /* Quiz Main Content */
        .main-content {
            flex: 1;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .lecture-header {
            background: rgba(30, 41, 59, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--teal-dark);
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .lecture-header h2 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .lecture-header p {
            color: var(--teal-light);
            font-size: 1rem;
        }

        .question-card {
            background: var(--black-card);
            border-radius: 15px;
            padding: 30px;
            border-left: 4px solid var(--teal-dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .bilingual-text {
            margin-bottom: 20px;
        }

        .text-eng {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .text-hin {
            font-size: 1.05rem;
            color: var(--teal-light);
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 180, 219, 0.1);
            border-color: var(--teal-light);
            transform: translateX(5px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn.correct-ans {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            opacity: 1;
        }

        .option-btn.wrong-ans {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            opacity: 1;
        }

        .opt-eng { font-weight: 500; margin-bottom: 4px; }
        .opt-hin { font-size: 0.9rem; color: var(--text-dim); }

        /* Explanations */
        .explanation-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideDown 0.4s ease forwards;
        }

        .explanation-box.correct { background: rgba(16, 185, 129, 0.1); border-left: 3px solid var(--success); }
        .explanation-box.wrong { background: rgba(239, 68, 68, 0.1); border-left: 3px solid var(--danger); }

        .exp-title { font-weight: 600; margin-bottom: 10px; font-size: 1.1rem; }
        .explanation-box.correct .exp-title { color: var(--success); }
        .explanation-box.wrong .exp-title { color: var(--danger); }

        .exp-content-eng { margin-bottom: 8px; font-size: 0.95rem; line-height: 1.5; }
        .exp-content-hin { color: var(--teal-light); font-size: 0.95rem; line-height: 1.5; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .layout-container { flex-direction: column; }
            .sidebar { 
                position: relative; 
                top: 0; 
                height: auto; 
                flex: none; 
                width: 100%; 
                border-radius: 15px;
                padding: 20px;
            }
            .progress-grid { grid-template-columns: repeat(10, 1fr); margin-top: 20px; }
            .score-display { font-size: 2.5rem; }
        }

        @media (max-width: 600px) {
            .progress-grid { grid-template-columns: repeat(5, 1fr); }
            .college-info h1 { font-size: 1.8rem; }
            .text-eng { font-size: 1.05rem; }
            .text-hin { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div class="layout-container">
    <!-- Tracker Sidebar -->
    <aside class="sidebar">
        <!-- Home Button -->
        <a href="index.html" class="home-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Back to Main Course Page
        </a>

        <div class="college-info">
            <h1>SIMT</h1>
            <div style="font-size: 1.1rem; font-weight: 500; margin-top: 5px;">BBA / BCA 1st Year</div>
            <div style="color: var(--text-dim); font-size: 0.9rem;">Environmental Science</div>
            <div class="instructor-badge">Instructor: HARISH SAIFI</div>
        </div>

        <div class="score-section">
            <div class="score-title">
                स्कोर / Score
            </div>
            <div class="score-display">
                <span id="current-score">0</span><span style="font-size: 1.5rem; color: var(--text-dim);">/20</span>
            </div>
        </div>

        <div class="score-title" style="text-align: center; font-size: 1rem;">
            प्रगति / Progress
        </div>
        <div class="progress-grid" id="progress-grid">
            <!-- JS will generate 20 dots here -->
        </div>
    </aside>

    <!-- Quiz Content -->
    <main class="main-content">
        
        <div class="lecture-header">
            <h2>Lecture 2: Segments of the Environment</h2>
            <p>Man-Environment Relationship: Determinism vs. Possibilism</p>
        </div>

        <div id="quiz-container" style="display: flex; flex-direction: column; gap: 25px;">
            <!-- JS will generate questions here -->
        </div>
    </main>
</div>

<script>
    const quizData = [
        {
            qE: "What are the four major segments of the environment?",
            qH: "पर्यावरण के चार प्रमुख खंड कौन से हैं?",
            options: [
                { e: "Troposphere, Stratosphere, Mesosphere, Exosphere", h: "क्षोभमंडल, समताप मंडल, मध्यमंडल, बहिर्मंडल", correct: false },
                { e: "Lithosphere, Hydrosphere, Atmosphere, Biosphere", h: "स्थलमंडल, जलमंडल, वायुमंडल, जीवमंडल", correct: true },
                { e: "Biotic, Abiotic, Organic, Inorganic", h: "जैविक, अजैविक, कार्बनिक, अकार्बनिक", correct: false },
                { e: "Land, Water, Fire, Sky", h: "भूमि, जल, अग्नि, आकाश", correct: false }
            ],
            expE: "The Earth's environment is categorized into these four interconnected physical spheres.",
            expH: "पृथ्वी के पर्यावरण को इन चार परस्पर जुड़े भौतिक क्षेत्रों में वर्गीकृत किया गया है।"
        },
        {
            qE: "The solid outermost layer of the Earth, consisting of rocks, soil, and minerals, is called the:",
            qH: "पृथ्वी की ठोस सबसे बाहरी परत, जिसमें चट्टानें, मिट्टी और खनिज शामिल हैं, कहलाती है:",
            options: [
                { e: "Lithosphere", h: "स्थलमंडल", correct: true },
                { e: "Biosphere", h: "जीवमंडल", correct: false },
                { e: "Atmosphere", h: "वायुमंडल", correct: false },
                { e: "Hydrosphere", h: "जलमंडल", correct: false }
            ],
            expE: "Lithosphere provides the physical platform for terrestrial life, agriculture, and human settlements.",
            expH: "स्थलमंडल स्थलीय जीवन, कृषि और मानव बस्तियों के लिए भौतिक मंच प्रदान करता है।"
        },
        {
            qE: "Which segment encompasses all water bodies, including oceans, rivers, and groundwater?",
            qH: "किस खंड में महासागरों, नदियों और भूजल सहित सभी जल निकाय शामिल हैं?",
            options: [
                { e: "Lithosphere", h: "स्थलमंडल", correct: false },
                { e: "Atmosphere", h: "वायुमंडल", correct: false },
                { e: "Biosphere", h: "जीवमंडल", correct: false },
                { e: "Hydrosphere", h: "जलमंडल", correct: true }
            ],
            expE: "The hydrosphere contains all the solid, liquid, and gaseous water on Earth.",
            expH: "जलमंडल में पृथ्वी पर मौजूद सभी ठोस, तरल और गैसीय जल शामिल हैं।"
        },
        {
            qE: "The 'Biosphere' can be best described as:",
            qH: "'जीवमंडल' को सबसे अच्छे तरीके से वर्णित किया जा सकता है:",
            options: [
                { e: "The deepest part of the ocean", h: "समुद्र का सबसे गहरा हिस्सा", correct: false },
                { e: "The zone where land, water, and air interact to support life", h: "वह क्षेत्र जहाँ भूमि, जल और वायु जीवन का समर्थन करने के लिए परस्पर क्रिया करते हैं", correct: true },
                { e: "The uppermost layer of the atmosphere", h: "वायुमंडल की सबसे ऊपरी परत", correct: false },
                { e: "An artificial environment created by humans", h: "मनुष्यों द्वारा निर्मित एक कृत्रिम वातावरण", correct: false }
            ],
            expE: "It is the narrow life-supporting zone where the other three spheres overlap.",
            expH: "यह जीवन का समर्थन करने वाला संकीर्ण क्षेत्र है जहां अन्य तीन क्षेत्र ओवरलैप करते हैं।"
        },
        {
            qE: "The theory that the physical environment strictly dictates human culture, behavior, and social development is known as:",
            qH: "यह सिद्धांत कि भौतिक पर्यावरण मानव संस्कृति, व्यवहार और सामाजिक विकास को सख्ती से तय करता है, कहलाता है:",
            options: [
                { e: "Environmental Possibilism", h: "पर्यावरणीय संभववाद", correct: false },
                { e: "Environmental Determinism", h: "पर्यावरणीय नियतिवाद", correct: true },
                { e: "Cultural Ecology", h: "सांस्कृतिक पारिस्थितिकी", correct: false },
                { e: "Eco-feminism", h: "इको-फेमिनिज्म", correct: false }
            ],
            expE: "Determinism views nature as the active force and humans as passive agents responding to it.",
            expH: "नियतिवाद प्रकृति को सक्रिय शक्ति के रूप में और मनुष्यों को इसके प्रति प्रतिक्रिया करने वाले निष्क्रिय एजेंटों के रूप में देखता है।"
        },
        {
            qE: "According to Environmental Possibilism, the environment offers:",
            qH: "पर्यावरणीय संभववाद (Possibilism) के अनुसार, पर्यावरण क्या प्रदान करता है?",
            options: [
                { e: "Strict boundaries that cannot be crossed", h: "सख्त सीमाएं जिन्हें पार नहीं किया जा सकता", correct: false },
                { e: "Opportunities and choices for humans to select and modify", h: "मनुष्यों को चुनने और संशोधित करने के अवसर और विकल्प", correct: true },
                { e: "Predetermined paths for human evolution", h: "मानव विकास के लिए पूर्व निर्धारित मार्ग", correct: false },
                { e: "Total control over human intelligence", h: "मानव बुद्धि पर पूर्ण नियंत्रण", correct: false }
            ],
            expE: "Possibilism suggests humans have the capability to choose from various possibilities offered by nature.",
            expH: "संभववाद बताता है कि मनुष्यों में प्रकृति द्वारा दी गई विभिन्न संभावनाओं में से चुनने की क्षमता है।"
        },
        {
            qE: "Developing advanced irrigation systems to grow crops in a harsh desert is a practical example of:",
            qH: "कठोर रेगिस्तान में फसल उगाने के लिए उन्नत सिंचाई प्रणाली विकसित करना किसका व्यावहारिक उदाहरण है?",
            options: [
                { e: "Determinism", h: "नियतिवाद", correct: false },
                { e: "Neo-determinism", h: "नव-नियतिवाद", correct: false },
                { e: "Possibilism", h: "संभववाद", correct: true },
                { e: "Nihilism", h: "शून्यवाद", correct: false }
            ],
            expE: "By overcoming the natural limit (lack of water) using technology, humans demonstrate Possibilism.",
            expH: "प्रौद्योगिकी का उपयोग करके प्राकृतिक सीमा (पानी की कमी) को पार करके, मनुष्य संभववाद का प्रदर्शन करते हैं।"
        },
        {
            qE: "The concept of 'Stop-and-Go Determinism' (Neo-determinism), which balances both extremes, was introduced by:",
            qH: "'स्टॉप-एंड-गो डिटरमिनिज्म' (नव-नियतिवाद) की अवधारणा, जो दोनों चरम सीमाओं को संतुलित करती है, किसके द्वारा पेश की गई थी?",
            options: [
                { e: "Charles Darwin", h: "चार्ल्स डार्विन", correct: false },
                { e: "Carl Ritter", h: "कार्ल रिटर", correct: false },
                { e: "Griffith Taylor", h: "ग्रिफिथ टेलर", correct: true },
                { e: "Vidal de La Blache", h: "विडाल डे ला ब्लाचे", correct: false }
            ],
            expE: "Griffith Taylor argued that humans can accelerate, slow, or stop their progress, but cannot completely ignore nature's 'traffic signals'.",
            expH: "ग्रिफिथ टेलर ने तर्क दिया कि मनुष्य अपनी प्रगति को तेज, धीमा या रोक सकते हैं, लेकिन प्रकृति के 'ट्रैफिक सिग्नल' को पूरी तरह से नजरअंदाज नहीं कर सकते।"
        },
        {
            qE: "In Environmental Determinism, early human societies were viewed primarily as:",
            qH: "पर्यावरणीय नियतिवाद में, प्रारंभिक मानव समाजों को मुख्य रूप से किस रूप में देखा जाता था?",
            options: [
                { e: "Passive agents controlled by natural forces", h: "प्राकृतिक शक्तियों द्वारा नियंत्रित निष्क्रिय एजेंट", correct: true },
                { e: "Masters of their environment", h: "अपने पर्यावरण के स्वामी", correct: false },
                { e: "Creators of synthetic ecosystems", h: "सिंथेटिक पारिस्थितिक तंत्र के निर्माता", correct: false },
                { e: "Independent of climatic changes", h: "जलवायु परिवर्तनों से स्वतंत्र", correct: false }
            ],
            expE: "Early geographers believed climate and geography solely shaped human traits and societal success.",
            expH: "प्रारंभिक भूगोलवेत्ताओं का मानना था कि जलवायु और भूगोल ही मानव लक्षणों और सामाजिक सफलता को आकार देते हैं।"
        },
        {
            qE: "The gaseous layer extending up to several hundred kilometers above the Earth's surface is the:",
            qH: "पृथ्वी की सतह से कई सौ किलोमीटर ऊपर तक फैली गैसीय परत है:",
            options: [
                { e: "Atmosphere", h: "वायुमंडल", correct: true },
                { e: "Lithosphere", h: "स्थलमंडल", correct: false },
                { e: "Hydrosphere", h: "जलमंडल", correct: false },
                { e: "Cryosphere", h: "क्रायोस्फीयर", correct: false }
            ],
            expE: "It is composed mainly of Nitrogen (78%) and Oxygen (21%) and protects the Earth from harmful solar radiation.",
            expH: "यह मुख्य रूप से नाइट्रोजन (78%) और ऑक्सीजन (21%) से बना है और पृथ्वी को हानिकारक सौर विकिरण से बचाता है।"
        },

    const quizContainer = document.getElementById('quiz-container');
    const progressGrid = document.getElementById('progress-grid');
    const scoreElement = document.getElementById('current-score');
    let currentScore = 0;

    function initQuiz() {
        quizData.forEach((q, index) => {
            const qNum = index + 1;
            
            // 1. Create Progress Dot
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.id = `dot-${qNum}`;
            dot.innerText = qNum;
            progressGrid.appendChild(dot);

            // 2. Create Question Card
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${qNum}`;

            // Header Texts (Eng/Hin)
            const headerHTML = `
                <div class="bilingual-text">
                    <div class="text-eng">${qNum}. ${q.qE}</div>
                    <div class="text-hin">${q.qH}</div>
                </div>
                <div class="options-grid" id="options-${qNum}"></div>
                <div class="explanation-box" id="exp-${qNum}"></div>
            `;
            card.innerHTML = headerHTML;
            quizContainer.appendChild(card);

            // Options logic
            const optionsContainer = document.getElementById(`options-${qNum}`);
            const expBox = document.getElementById(`exp-${qNum}`);

            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <span class="opt-eng">${String.fromCharCode(65 + optIndex)}. ${opt.e}</span>
                    <span class="opt-hin">${opt.h}</span>
                `;
                
                btn.onclick = () => handleAnswer(btn, qNum, opt.correct, q, optionsContainer, expBox);
                optionsContainer.appendChild(btn);
            });
        });
    }

    function handleAnswer(selectedBtn, qNum, isCorrect, qData, optionsContainer, expBox) {
        // Disable all buttons in this question
        const allBtns = optionsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        const dot = document.getElementById(`dot-${qNum}`);

        if (isCorrect) {
            selectedBtn.classList.add('correct-ans');
            expBox.classList.add('correct');
            expBox.innerHTML = `
                <div class="exp-title">✓ Correct! / सही उत्तर!</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('correct');
            currentScore++;
            scoreElement.innerText = currentScore;
        } else {
            selectedBtn.classList.add('wrong-ans');
            expBox.classList.add('wrong');
            
            // Find and highlight correct answer
            allBtns.forEach((btn, idx) => {
                if(qData.options[idx].correct) {
                    btn.classList.add('correct-ans');
                }
            });

            expBox.innerHTML = `
                <div class="exp-title">✕ Incorrect / गलत उत्तर</div>
                <div class="exp-content-eng">${qData.expE}</div>
                <div class="exp-content-hin">${qData.expH}</div>
            `;
            dot.classList.add('wrong');
        }

        expBox.style.display = 'block';
    }

    // Render on load
    window.onload = initQuiz;
</script>
